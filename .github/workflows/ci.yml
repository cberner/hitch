name: CI

on:
  pull_request:
  push: # required for actions/cache to work
    branches:
      - master

jobs:
  compliance:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Ban AI-authored commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --no-recurse-submodules origin "$BASE_SHA"
          offenders=$(git log --no-merges --pretty=format:'%H %an <%ae> committed by %cn <%ce>' "$BASE_SHA".."$HEAD_SHA" \
            | grep -iE '(claude|codex)' || true)
          if [ -n "$offenders" ]; then
            echo "Commits authored or committed by Claude or Codex are not allowed:"
            echo "$offenders"
            exit 1
          fi
      - name: Non ASCII characters
        run: |
          if grep -P -n "[^\x00-\x7F]" -r --include="*.rs" --include="*.py" --include="*.toml" --exclude-dir='.*' .; then
          echo "Non-ASCII characters detected"
          exit 1
          fi

  ci:
    strategy:
      matrix:
        os: ["ubuntu-latest"]

    runs-on: ${{ matrix.os }}

    permissions:
      # Required for codecov/codecov-action OIDC token exchange
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6
      - name: Cache
        id: rust-cache
        uses: actions/cache@v4
        with:
            path: |
                ~/.cargo/bin/uv
                ~/.cargo/bin/just
                ~/.cargo/registry/index/
                ~/.cargo/registry/cache/
                ~/.cargo/git/db/
                ~/.cache/uv/
            key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml', 'uv.lock', '.github/workflows/*.yml') }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install codex
        # Match the `openai-codex` Python SDK in pyproject.toml: the
        # app-server protocol is versioned, so SDK and CLI must come from the
        # same release. Use the version declared in `sdk/python/pyproject.toml`
        # at the pinned git tag (PEP 440 `X.Y.ZaN` ↔ npm `X.Y.Z-alpha.N`);
        # this can lag the Rust crate tag name the SDK pin is taken from.
        run: npm install -g @openai/codex@0.131.0-alpha.4

      - name: Cache ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-coder-0.5b

      - name: Install ollama and pull model
        env:
          # Pinned to a published release with a known sha256 so the install
          # is not a `curl | sh` supply-chain entry point. Bump both fields
          # together; the checksum is published at
          # https://github.com/ollama/ollama/releases/download/<ver>/sha256sum.txt
          OLLAMA_VERSION: v0.23.4
          OLLAMA_SHA256: c0822ce85413647f8502862c7179740311f271fcff8f21d61c6d352729f4c28d
        run: |
          sudo apt-get install -y zstd
          curl -fsSL "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst" -o /tmp/ollama.tar.zst
          echo "${OLLAMA_SHA256}  /tmp/ollama.tar.zst" | sha256sum -c -
          sudo tar -I zstd -C /usr -xf /tmp/ollama.tar.zst
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:11434/api/tags > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://localhost:11434/api/tags > /dev/null; then
            echo "ollama did not become ready within 30s" >&2
            cat /tmp/ollama.log >&2
            exit 1
          fi
          for attempt in $(seq 1 4); do
            if ollama pull qwen2.5-coder:0.5b; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep 30
          done

      - name: Install just
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo install --force --version 1.36.0 just --locked

      - name: Install uv
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo install --force --version 0.9.11 uv --locked

      - name: Run tests
        run: just test

      - name: Run integration tests
        run: just test-integration

      - name: Run coverage
        run: just coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          use_oidc: true
          fail_ci_if_error: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            htmlcov/
            coverage.xml
          if-no-files-found: error
