<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>HITCH - New project</title>
    <style>
        {% include "_color_tokens.html" %}
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
        }
        main {
            width: min(560px, calc(100% - 2rem));
            margin: 0 auto;
            padding: 2rem 0;
        }
        .project-panel {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow-lg);
            padding: 1.25rem;
        }
        h1 {
            margin: 0 0 1rem;
            font-size: 1.15rem;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        label {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            color: var(--text-muted);
            font-size: 0.84rem;
            font-weight: 500;
        }
        input[type="text"],
        select {
            width: 100%;
            font: inherit;
            font-size: 0.95rem;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            padding: 0.65rem 0.75rem;
            background: var(--bg);
            color: var(--text);
        }
        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .empty-repos {
            margin: 0;
            color: var(--danger);
            font-size: 0.84rem;
        }
        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        {% include "_button_styles.html" %}
    </style>
</head>
<body>
    <main>
        <section class="project-panel">
            <h1>Create project</h1>
            <form method="post">
                {% csrf_token %}
                <label>
                    Name
                    <input type="text" name="name" maxlength="{{ name_max_len }}" required autocomplete="off">
                </label>
                <label>
                    Repository
                    {% if repos %}
                    <select name="repo_path" required>
                        {% for repo in repos %}
                        <option value="{{ repo }}">{{ repo }}</option>
                        {% endfor %}
                    </select>
                    {% else %}
                    <select name="repo_path" required disabled></select>
                    <p class="empty-repos">No git repositories without projects were found within two levels of your home directory.</p>
                    {% endif %}
                </label>
                <div class="actions">
                    <a class="button secondary" href="{{ index_url }}">Cancel</a>
                    <button type="submit" class="button" {% if not repos %}disabled{% endif %}>Create</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
