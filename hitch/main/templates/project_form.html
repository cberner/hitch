<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>HITCH - New project</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f7f2e8;
            --surface: #ffffff;
            --border: #d8cdbd;
            --border-strong: #c4b69f;
            --text: #1c252e;
            --text-muted: #545d58;
            --accent: #4f8f66;
            --accent-hover: #3f7b56;
            --accent-soft: rgba(79, 143, 102, 0.10);
            --accent-fg: #ffffff;
            --danger: #b94f42;
            --shadow-lg: 0 8px 24px rgba(28, 37, 46, 0.10);
            --radius: 12px;
            --radius-sm: 8px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #161c1a;
                --surface: #1f2624;
                --border: #2f3835;
                --border-strong: #3d4744;
                --text: #e8e4d8;
                --text-muted: #a0a29a;
                --accent: #6fb286;
                --accent-hover: #84c49a;
                --accent-soft: rgba(111, 178, 134, 0.14);
                --accent-fg: #0c1814;
                --danger: #d97062;
                --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.4);
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
        }
        main {
            width: min(560px, calc(100% - 2rem));
            margin: 0 auto;
            padding: 2rem 0;
        }
        .project-panel {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow-lg);
            padding: 1.25rem;
        }
        h1 {
            margin: 0 0 1rem;
            font-size: 1.15rem;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        label {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            color: var(--text-muted);
            font-size: 0.84rem;
            font-weight: 500;
        }
        input[type="text"],
        select {
            width: 100%;
            font: inherit;
            font-size: 0.95rem;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            padding: 0.65rem 0.75rem;
            background: var(--bg);
            color: var(--text);
        }
        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .empty-repos {
            margin: 0;
            color: var(--danger);
            font-size: 0.84rem;
        }
        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .button {
            font: inherit;
            font-weight: 500;
            background: var(--accent);
            color: var(--accent-fg);
            border: 1px solid var(--accent);
            border-radius: 999px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            font-size: 0.9rem;
        }
        .button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .button.secondary {
            background: transparent;
            color: var(--text);
            border-color: var(--border-strong);
        }
    </style>
</head>
<body>
    <main>
        <section class="project-panel">
            <h1>Create project</h1>
            <form method="post">
                {% csrf_token %}
                <label>
                    Name
                    <input type="text" name="name" maxlength="{{ name_max_len }}" required autocomplete="off">
                </label>
                <label>
                    Repository
                    {% if repos %}
                    <select name="repo_path" required>
                        {% for repo in repos %}
                        <option value="{{ repo }}">{{ repo }}</option>
                        {% endfor %}
                    </select>
                    {% else %}
                    <select name="repo_path" required disabled></select>
                    <p class="empty-repos">No git repositories without projects were found within two levels of your home directory.</p>
                    {% endif %}
                </label>
                <div class="actions">
                    <a class="button secondary" href="{{ index_url }}">Cancel</a>
                    <button type="submit" class="button" {% if not repos %}disabled{% endif %}>Create</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
