<form class="settings-form" method="post" action="{{ settings_url }}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ settings_next_url }}">
    {{ model_options_by_provider|json_script:"provider-model-options" }}
    <label>
        Provider
        <select name="provider" data-settings-provider-select>
            {% for option in provider_options %}
            <option value="{{ option.id }}" {% if option.id == current_provider %}selected{% endif %}>{{ option.display_name }}</option>
            {% endfor %}
        </select>
    </label>
    <label>
        Model
        <span data-settings-model-field data-current-model="{{ current_model }}">
        {% if model_options %}
        <select name="model" data-settings-model-select>
            {% for option in model_options %}
            <option value="{{ option.id }}" {% if option.id == current_model %}selected{% endif %} data-supported-efforts="{{ option.supported_efforts }}">{{ option.display_name }}</option>
            {% endfor %}
        </select>
        {% else %}
        <input type="text" name="model" data-settings-model-input value="{{ current_model }}" placeholder="Codex returned no models" autocomplete="off">
        {% endif %}
        </span>
    </label>
    <label>
        Reasoning effort
        <select name="reasoning_effort" data-settings-effort-select>
            <option value="" {% if not current_effort %}selected{% endif %}>Model default</option>
            {% for option in effort_options %}
            <option value="{{ option.value }}" {% if option.value == current_effort %}selected{% endif %} data-effort-option {% if not option.supported %}hidden disabled{% endif %}>{{ option.value }}</option>
            {% endfor %}
        </select>
    </label>
    <label>
        Sandbox policy
        <select name="sandbox_policy">
            <option value="" {% if not current_sandbox %}selected{% endif %}>Codex default</option>
            {% for option in sandbox_options %}
            <option value="{{ option.id }}" {% if option.id == current_sandbox %}selected{% endif %}>{{ option.display_name }}</option>
            {% endfor %}
        </select>
    </label>
    <label>
        Approval mode
        <select name="approval_mode">
            {% for option in approval_options %}
            <option value="{{ option.id }}" {% if option.id == current_approval %}selected{% endif %}>{{ option.display_name }}</option>
            {% endfor %}
        </select>
    </label>
    <label>
        Coding agent
        <select name="coding_agent">
            {% for option in coding_agent_options %}
            <option value="{{ option.id }}" {% if option.id == current_coding_agent %}selected{% endif %}>{{ option.display_name }}</option>
            {% endfor %}
        </select>
    </label>
    <label>
        Extra developer prompt
        <textarea class="extra-system-prompt" name="extra_system_prompt" maxlength="{{ extra_system_prompt_max_len }}" autocomplete="off" placeholder="Optional developer instructions for new sessions">{{ current_extra_system_prompt }}</textarea>
    </label>
    <label class="checkbox-label">
        <span>Use worktrees</span>
        <input type="checkbox" name="use_worktrees" value="true" {% if current_use_worktrees %}checked{% endif %}>
    </label>
    <label class="checkbox-label">
        <span>Auto-PR</span>
        <input type="checkbox" name="auto_pr" value="true" {% if current_auto_pr %}checked{% endif %}>
    </label>
    <label class="checkbox-label">
        <span>Auto-QA</span>
        <input type="checkbox" name="auto_qa" value="true" {% if current_auto_qa %}checked{% endif %}>
    </label>
    <label>
        Web search
        <select name="web_search_mode">
            {% for option in web_search_options %}
            <option value="{{ option.id }}" {% if option.id == current_web_search %}selected{% endif %}>{{ option.display_name }}</option>
            {% endfor %}
        </select>
    </label>
    <label class="checkbox-label">
        <span>Spec Critic preflight</span>
        <input type="checkbox" name="spec_critic" value="true" {% if current_spec_critic %}checked{% endif %}>
    </label>
    <label class="checkbox-label" data-codex-only>
        <span>Enable Codex memories</span>
        <input type="checkbox" name="enable_memories" value="true" {% if current_enable_memories %}checked{% endif %}>
    </label>
    <label>
        Max Hitch disk usage (%)
        <input type="hidden" name="initial_disk_usage_max_percent" value="{{ current_disk_usage_max_percent }}">
        <input type="number" name="disk_usage_max_percent" value="{{ current_disk_usage_max_percent }}" min="0.1" max="100" step="0.1" inputmode="decimal" required>
    </label>
    <label>
        Project
        <select name="selected_project" data-settings-project-select>
            <option value="" {% if not current_project_id %}selected{% endif %}>All projects</option>
            {% for project in projects %}
            <option
                value="{{ project.pk }}"{% if project.pk == current_project_id %} selected{% endif %}
                data-project-name="{{ project.name }}"
                data-project-repo-path="{{ project.repo_path }}"
                data-project-extra-system-prompt="{{ project.extra_system_prompt }}"
                data-project-auto-pr-mode="{{ project.auto_pr_mode }}"
                data-project-auto-pull-enabled="{% if project.auto_pull_enabled %}true{% else %}false{% endif %}"
            >{{ project.name }}</option>
            {% endfor %}
        </select>
    </label>
    <div class="settings-link-row">
        <a class="button secondary" href="{{ new_project_url }}">Create project</a>
        <button type="button" class="button secondary" data-project-edit-open {% if not current_project_id %}disabled{% endif %}>Edit project</button>
    </div>
    <div class="actions">
        <button type="submit" class="button">Save</button>
        <a class="button secondary" href="{{ settings_cancel_url }}">Cancel</a>
    </div>
</form>
<script>
(function () {
    const providerSelect = document.querySelector("[data-settings-provider-select]");
    const fieldNode = document.querySelector("[data-settings-model-field]");
    const optionsNode = document.getElementById("provider-model-options");
    if (!providerSelect || !fieldNode || !optionsNode) {
        return;
    }
    let optionsByProvider = {};
    try {
        optionsByProvider = JSON.parse(optionsNode.textContent);
    } catch (err) {
        return;
    }
    // Seed from the saved model so switching away and back restores it. Read it
    // off whichever control was rendered, falling back to the data attribute the
    // server stamped (set even when the field rendered as a plain text input).
    const initialModel =
        fieldNode.dataset.currentModel ||
        (function () {
            const ctrl = fieldNode.querySelector("[name=model]");
            return ctrl ? ctrl.value : "";
        })();

    function buildSelect(options, selected) {
        // Reuse the existing <select> when present so the effort-filter script's
        // change listener (bound once on page load) keeps firing for the common
        // Codex case; only its <option>s are rebuilt.
        let select = fieldNode.querySelector("[data-settings-model-select]");
        if (!select) {
            select = document.createElement("select");
            select.name = "model";
            select.setAttribute("data-settings-model-select", "");
            fieldNode.innerHTML = "";
            fieldNode.appendChild(select);
        }
        select.innerHTML = "";
        options.forEach(function (option) {
            const el = document.createElement("option");
            el.value = option.id;
            el.textContent = option.display_name;
            el.dataset.supportedEfforts = option.supported_efforts || "";
            select.appendChild(el);
        });
        if (selected) {
            select.value = selected;
        }
        // Let the reasoning-effort filter re-evaluate against the new model.
        // ``bubbles: true`` so the filter's delegated document listener catches
        // it even for a <select> created here (e.g. from the free-text fallback).
        select.dispatchEvent(new Event("change", { bubbles: true }));
    }

    function buildTextInput(value) {
        let input = fieldNode.querySelector("[data-settings-model-input]");
        if (!input) {
            input = document.createElement("input");
            input.type = "text";
            input.name = "model";
            input.autocomplete = "off";
            input.placeholder = "Codex returned no models";
            input.setAttribute("data-settings-model-input", "");
            fieldNode.innerHTML = "";
            fieldNode.appendChild(input);
        }
        input.value = value || "";
    }

    function repopulateModels() {
        const provider = providerSelect.value;
        const options = optionsByProvider[provider] || [];
        const current = fieldNode.querySelector("[name=model]");
        const previous = current ? current.value : "";
        if (options.length === 0) {
            // No catalog for this provider (e.g. Codex listing unavailable):
            // fall back to a free-text model field rather than an empty select.
            buildTextInput(previous || initialModel);
            return;
        }
        // Keep the saved model selected when it still belongs to this provider.
        const keep = options.some(function (o) { return o.id === previous; })
            ? previous
            : (options.some(function (o) { return o.id === initialModel; }) ? initialModel : "");
        buildSelect(options, keep);
    }

    function toggleCodexOnly() {
        const isCodex = providerSelect.value === "codex";
        document.querySelectorAll("[data-codex-only]").forEach(function (node) {
            node.hidden = !isCodex;
        });
    }

    providerSelect.addEventListener("change", function () {
        repopulateModels();
        toggleCodexOnly();
    });
    toggleCodexOnly();
})();
</script>
