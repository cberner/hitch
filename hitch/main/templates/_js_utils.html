<script>
    // Shared client-side helpers, attached to a single window.hitch namespace so
    // any inline script block (or page) can reuse them. Loaded once per page,
    // right after _js_class_bootstrap.html, before any block that uses it.
    window.hitch = window.hitch || {};

    // Django renders the CSRF token both as a `csrftoken` cookie and as a hidden
    // form input; prefer the cookie and fall back to the input so this works on
    // pages with or without a rendered form.
    window.hitch.csrfToken = function () {
        try {
            // document.cookie can throw in a sandboxed/opaque-origin document;
            // fall back to the hidden form input in that case.
            const match = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
            if (match) {
                return decodeURIComponent(match[1]);
            }
        } catch (error) {
            /* fall through to the form input */
        }
        const input = document.querySelector("input[name='csrfmiddlewaretoken']");
        return input ? input.value : "";
    };

    // Issue a form-encoded, same-origin POST with the CSRF token attached, and
    // return the raw fetch promise -- callers handle the response (their
    // success/error/409 handling legitimately differs). Pass {xhr: true} to add
    // the X-Requested-With header, which some endpoints use to answer 204
    // instead of redirecting. `body` may be a string or a URLSearchParams.
    window.hitch.postForm = function (url, body, options) {
        options = options || {};
        const headers = {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": window.hitch.csrfToken(),
        };
        if (options.xhr) {
            headers["X-Requested-With"] = "XMLHttpRequest";
        }
        return fetch(url, {
            method: "POST",
            headers: headers,
            body: body instanceof URLSearchParams ? body.toString() : body,
            credentials: "same-origin",
        });
    };

    // Copy text to the clipboard, resolving to whether it succeeded. Prefers the
    // async Clipboard API (secure contexts) and falls back to a hidden textarea
    // + execCommand for older/insecure contexts. Callers can present their own
    // last-resort UI when this resolves false.
    window.hitch.copyToClipboard = function (text) {
        function fallback() {
            // Never throw: execCommand can be unavailable or denied, and the
            // helper promises to resolve a boolean so callers can show their own
            // last-resort UI.
            try {
                const textarea = document.createElement("textarea");
                textarea.value = text;
                textarea.setAttribute("readonly", "");
                textarea.style.position = "fixed";
                textarea.style.top = "-1000px";
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    return document.execCommand("copy");
                } finally {
                    textarea.remove();
                }
            } catch (error) {
                return false;
            }
        }
        if (!text) {
            return Promise.resolve(false);
        }
        if (
            window.isSecureContext
            && navigator.clipboard
            && typeof navigator.clipboard.writeText === "function"
        ) {
            try {
                return navigator.clipboard.writeText(text).then(
                    function () { return true; },
                    function () { return fallback(); }
                );
            } catch (error) {
                // writeText can throw synchronously instead of rejecting.
                return Promise.resolve(fallback());
            }
        }
        return Promise.resolve(fallback());
    };

    // Wire every <form data-confirm="..."> to confirm before submitting, so
    // pages don't need inline onsubmit="return confirm(...)" handlers. Idempotent
    // and safe to run on any page (a no-op where there are no such forms).
    window.hitch.wireConfirmForms = function (root) {
        const scope = root || document;
        const forms = scope.querySelectorAll("form[data-confirm]");
        for (const form of forms) {
            if (form.dataset.confirmWired === "1") {
                continue;
            }
            form.dataset.confirmWired = "1";
            form.addEventListener("submit", function (event) {
                if (!window.confirm(form.getAttribute("data-confirm"))) {
                    event.preventDefault();
                }
            });
        }
    };

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function () {
            window.hitch.wireConfirmForms();
        });
    } else {
        window.hitch.wireConfirmForms();
    }

    // Format a Date relative to now ("just now", "5 minutes ago", "in 2 days").
    // The formatter and unit table are built once.
    window.hitch.relativeFromNow = (function () {
        const relative = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
        const units = [
            ["year", 31536000],
            ["month", 2592000],
            ["week", 604800],
            ["day", 86400],
            ["hour", 3600],
            ["minute", 60],
        ];
        return function (date) {
            const diff = (date.getTime() - Date.now()) / 1000;
            for (const [unit, secs] of units) {
                if (Math.abs(diff) >= secs) {
                    return relative.format(Math.round(diff / secs), unit);
                }
            }
            return "just now";
        };
    })();
</script>
