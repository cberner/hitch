<script>
    // Shared client-side helpers, attached to a single window.hitch namespace so
    // any inline script block (or page) can reuse them. Loaded once per page,
    // right after _js_class_bootstrap.html, before any block that uses it.
    window.hitch = window.hitch || {};

    // Django renders the CSRF token both as a `csrftoken` cookie and as a hidden
    // form input; prefer the cookie and fall back to the input so this works on
    // pages with or without a rendered form.
    window.hitch.csrfToken = function () {
        try {
            // document.cookie can throw in a sandboxed/opaque-origin document;
            // fall back to the hidden form input in that case.
            const match = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
            if (match) {
                return decodeURIComponent(match[1]);
            }
        } catch (error) {
            /* fall through to the form input */
        }
        const input = document.querySelector("input[name='csrfmiddlewaretoken']");
        return input ? input.value : "";
    };

    // Issue a form-encoded, same-origin POST with the CSRF token attached, and
    // return the raw fetch promise -- callers handle the response (their
    // success/error/409 handling legitimately differs). Pass {xhr: true} to add
    // the X-Requested-With header, which some endpoints use to answer 204
    // instead of redirecting. `body` may be a string or a URLSearchParams.
    window.hitch.postForm = function (url, body, options) {
        options = options || {};
        const headers = {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": window.hitch.csrfToken(),
        };
        if (options.xhr) {
            headers["X-Requested-With"] = "XMLHttpRequest";
        }
        return fetch(url, {
            method: "POST",
            headers: headers,
            body: body instanceof URLSearchParams ? body.toString() : body,
            credentials: "same-origin",
        });
    };
</script>
