<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f2e8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#161c1a" media="(prefers-color-scheme: dark)">
    <title>Log in · HITCH</title>
    <style>
        {% include "_auth_styles.html" %}
    </style>
</head>
<body>
    <main>
        <h1>HITCH</h1>
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            {% if form.non_field_errors %}
            <div class="errors">{{ form.non_field_errors }}</div>
            {% endif %}
            <label>
                Username
                <input type="text" name="username" value="{{ form.username.value|default_if_none:'' }}" autocomplete="username" required autofocus>
            </label>
            {% for error in form.username.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
            <label>
                Password
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            {% for error in form.password.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
            <div class="actions">
                <a class="link" href="{{ register_url }}">Register</a>
                <button type="submit" class="button">Log in</button>
            </div>
        </form>
    </main>
</body>
</html>
