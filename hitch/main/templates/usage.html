<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f2e8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#161c1a" media="(prefers-color-scheme: dark)">
    <title>Usage - HITCH</title>
{% include "_js_class_bootstrap.html" %}
{% include "_js_utils.html" %}
    <style>
        {% include "_color_tokens.html" %}
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            padding-bottom: calc(2rem + var(--safe-bottom));
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: saturate(180%) blur(14px);
            -webkit-backdrop-filter: saturate(180%) blur(14px);
            border-bottom: 1px solid var(--border);
            padding-top: var(--safe-top);
        }
        .topbar-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
        }
        .topbar-leading {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            min-width: 0;
        }
        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex: 0 0 auto;
        }
        .brand {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            margin: 0;
            color: var(--text);
        }
        {% include "_primary_nav_styles.html" %}
        {% include "_button_styles.html" %}
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.25rem 1rem 2rem;
        }
        {% include "_usage_styles.html" %}
        @media (max-width: 480px) {
            .topbar-inner { padding: 0.7rem 1rem; }
            .usage-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 0.35rem;
            }
            .lifetime-stats {
                grid-template-columns: 1fr;
            }
            .lifetime-breakdown {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
            .rate-limit-row-head {
                align-items: flex-start;
                flex-direction: column;
                gap: 0.2rem;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="topbar-leading">
                {% include "_primary_nav.html" %}
                <h1 class="brand">HITCH</h1>
            </div>
            {% if not user.is_authenticated %}
            <div class="topbar-actions">
                <a class="button secondary account-action" href="{{ login_url }}">Log in</a>
                <a class="button account-action" href="{{ register_url }}">Register</a>
            </div>
            {% endif %}
        </div>
    </header>
    <main>
        {% include "_usage_sections.html" %}
    </main>
    <script>
        (function () {
            {% include "_usage_scripts.html" %}

            {% include "_primary_nav_script.html" %}
        })();
    </script>
</body>
</html>
