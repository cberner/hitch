<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f2e8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#161c1a" media="(prefers-color-scheme: dark)">
    <title>Usage - HITCH</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f7f2e8;
            --surface: #ffffff;
            --surface-2: #efe7da;
            --border: #d8cdbd;
            --border-strong: #c4b69f;
            --text: #1c252e;
            --text-muted: #545d58;
            --text-faint: #6f6b62;
            --accent: #4f8f66;
            --accent-hover: #3f7b56;
            --accent-soft: rgba(79, 143, 102, 0.10);
            --accent-fg: #ffffff;
            --shadow: 0 1px 2px rgba(28, 37, 46, 0.05);
            --shadow-lg: 0 8px 24px rgba(28, 37, 46, 0.10);
            --radius: 12px;
            --radius-sm: 8px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #161c1a;
                --surface: #1f2624;
                --surface-2: #2a322f;
                --border: #2f3835;
                --border-strong: #3d4744;
                --text: #e8e4d8;
                --text-muted: #a0a29a;
                --text-faint: #8a8b82;
                --accent: #6fb286;
                --accent-hover: #84c49a;
                --accent-soft: rgba(111, 178, 134, 0.14);
                --accent-fg: #0c1814;
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
                --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.4);
            }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            padding-bottom: calc(2rem + var(--safe-bottom));
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: saturate(180%) blur(14px);
            -webkit-backdrop-filter: saturate(180%) blur(14px);
            border-bottom: 1px solid var(--border);
            padding-top: var(--safe-top);
        }
        .topbar-inner {
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
        }
        .topbar-leading {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            min-width: 0;
        }
        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex: 0 0 auto;
        }
        .brand {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            margin: 0;
            color: var(--text);
        }
        {% include "_primary_nav_styles.html" %}
        .button {
            font: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            min-height: 2.4rem;
            border: 1px solid var(--accent);
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: var(--accent-fg);
            padding: 0.55rem 0.8rem;
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.12s ease, border-color 0.12s ease, transform 0.12s ease;
        }
        .button:active { transform: scale(0.98); }
        .button:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            text-decoration: none;
        }
        .button.secondary {
            background: transparent;
            color: var(--text);
            border-color: var(--border-strong);
        }
        .button.secondary:hover {
            background: var(--surface-2);
            border-color: var(--border-strong);
        }
        .account-action {
            min-height: 2.1rem;
            padding: 0.35rem 0.65rem;
            font-size: 0.86rem;
        }
        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 1.25rem 1rem 2rem;
        }
        {% include "_usage_styles.html" %}
        @media (max-width: 480px) {
            .topbar-inner { padding: 0.7rem 1rem; }
            .usage-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 0.35rem;
            }
            .lifetime-stats {
                grid-template-columns: 1fr;
            }
            .lifetime-breakdown {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
            .rate-limit-row-head {
                align-items: flex-start;
                flex-direction: column;
                gap: 0.2rem;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="topbar-leading">
                {% include "_primary_nav.html" %}
                <h1 class="brand">HITCH</h1>
            </div>
            {% if not user.is_authenticated %}
            <div class="topbar-actions">
                <a class="button secondary account-action" href="{{ login_url }}">Log in</a>
                <a class="button account-action" href="{{ register_url }}">Register</a>
            </div>
            {% endif %}
        </div>
    </header>
    <main>
        {% include "_usage_sections.html" %}
    </main>
    <script>
        (function () {
            {% include "_usage_scripts.html" %}

            {% include "_primary_nav_script.html" %}
        })();
    </script>
</body>
</html>
