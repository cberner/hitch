<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f2e8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#161c1a" media="(prefers-color-scheme: dark)">
    <title>Profile - HITCH</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f7f2e8;
            --surface: #ffffff;
            --surface-2: #efe7da;
            --border: #d8cdbd;
            --border-strong: #c4b69f;
            --text: #1c252e;
            --text-muted: #545d58;
            --accent: #4f8f66;
            --accent-hover: #3f7b56;
            --accent-soft: rgba(79, 143, 102, 0.10);
            --accent-fg: #ffffff;
            --danger: #b94f42;
            --shadow: 0 1px 2px rgba(28, 37, 46, 0.05);
            --shadow-lg: 0 8px 24px rgba(28, 37, 46, 0.10);
            --radius: 12px;
            --radius-sm: 8px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #161c1a;
                --surface: #1f2624;
                --surface-2: #2a322f;
                --border: #2f3835;
                --border-strong: #3d4744;
                --text: #e8e4d8;
                --text-muted: #a0a29a;
                --accent: #6fb286;
                --accent-hover: #84c49a;
                --accent-soft: rgba(111, 178, 134, 0.14);
                --accent-fg: #0c1814;
                --danger: #d97062;
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
                --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.4);
            }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        html.modal-scroll-locked,
        body.modal-scroll-locked { overflow: hidden; }
        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: saturate(180%) blur(14px);
            -webkit-backdrop-filter: saturate(180%) blur(14px);
            border-bottom: 1px solid var(--border);
            padding-top: var(--safe-top);
        }
        .topbar-inner {
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
        }
        .topbar-leading {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            min-width: 0;
        }
        .brand {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            margin: 0;
            color: var(--text);
        }
        {% include "_primary_nav_styles.html" %}
        .button {
            font: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            min-height: 2.4rem;
            border: 1px solid var(--accent);
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: var(--accent-fg);
            padding: 0.55rem 0.8rem;
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.12s ease, border-color 0.12s ease, transform 0.12s ease;
        }
        .button:active { transform: scale(0.98); }
        .button:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            text-decoration: none;
        }
        .button.danger {
            background: transparent;
            color: var(--danger);
            border-color: color-mix(in srgb, var(--danger) 55%, var(--border));
        }
        .button.danger:hover {
            background: color-mix(in srgb, var(--danger) 10%, transparent);
            border-color: var(--danger);
        }
        main {
            width: min(760px, 100%);
            min-height: calc(100vh - 4.2rem - var(--safe-top));
            min-height: calc(100dvh - 4.2rem - var(--safe-top));
            margin: 0 auto;
            padding: 1.25rem 1rem calc(1.5rem + var(--safe-bottom));
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        .section-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 0 0 0.75rem;
        }
        .profile-panel {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
            padding: 1rem;
        }
        .profile-panel h2 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 650;
            overflow-wrap: anywhere;
        }
        .profile-meta {
            margin: 0.35rem 0 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .profile-logout-form {
            margin: auto 0 0;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
        }
        {% include "_settings_dialog_styles.html" %}
        @media (max-width: 480px) {
            .topbar-inner { padding: 0.7rem 1rem; }
            .profile-logout-form .button { width: 100%; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="topbar-leading">
                {% include "_primary_nav.html" %}
                <h1 class="brand">HITCH</h1>
            </div>
        </div>
    </header>
    <main>
        <section class="profile-panel" aria-labelledby="profile-title">
            <p class="section-label">Profile</p>
            <h2 id="profile-title">{{ user.get_username }}</h2>
            <p class="profile-meta">Signed in</p>
        </section>
        <form class="profile-logout-form" method="post" action="{{ logout_url }}">
            {% csrf_token %}
            <button class="button danger" type="submit">Log out</button>
        </form>
    </main>
    {% include "_settings_dialog.html" %}
    <script>
        (function () {
            const modalScrollLockClass = "modal-scroll-locked";
            function syncModalScrollLock() {
                const hasOpenDialog = Boolean(document.querySelector("dialog[open]"));
                document.documentElement.classList.toggle(modalScrollLockClass, hasOpenDialog);
                document.body.classList.toggle(modalScrollLockClass, hasOpenDialog);
            }
            function showDialog(dialog) {
                if (!dialog) return;
                if (typeof dialog.showModal === "function") {
                    dialog.showModal();
                } else {
                    dialog.setAttribute("open", "");
                }
                syncModalScrollLock();
            }
            function hideDialog(dialog) {
                if (!dialog) return;
                if (typeof dialog.close === "function") {
                    dialog.close();
                } else {
                    dialog.removeAttribute("open");
                }
                syncModalScrollLock();
            }
            for (const dialog of document.querySelectorAll("dialog")) {
                dialog.addEventListener("close", syncModalScrollLock);
            }

            {% include "_primary_nav_script.html" %}
        })();
    </script>
</body>
</html>
