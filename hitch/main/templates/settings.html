<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f2e8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#161c1a" media="(prefers-color-scheme: dark)">
    <title>Settings - HITCH</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f7f2e8;
            --surface: #ffffff;
            --surface-2: #efe7da;
            --border: #d8cdbd;
            --border-strong: #c4b69f;
            --text: #1c252e;
            --text-muted: #545d58;
            --text-faint: #6f6b62;
            --accent: #4f8f66;
            --accent-hover: #3f7b56;
            --accent-soft: rgba(79, 143, 102, 0.10);
            --accent-fg: #ffffff;
            --shadow-lg: 0 8px 24px rgba(28, 37, 46, 0.10);
            --radius-sm: 8px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #161c1a;
                --surface: #1f2624;
                --surface-2: #2a322f;
                --border: #2f3835;
                --border-strong: #3d4744;
                --text: #e8e4d8;
                --text-muted: #a0a29a;
                --text-faint: #8a8b82;
                --accent: #6fb286;
                --accent-hover: #84c49a;
                --accent-soft: rgba(111, 178, 134, 0.14);
                --accent-fg: #0c1814;
                --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.4);
            }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        html.modal-scroll-locked,
        body.modal-scroll-locked { overflow: hidden; }
        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: saturate(180%) blur(14px);
            -webkit-backdrop-filter: saturate(180%) blur(14px);
            border-bottom: 1px solid var(--border);
            padding-top: var(--safe-top);
        }
        .topbar-inner {
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
        }
        .topbar-leading {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            min-width: 0;
        }
        .brand {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            margin: 0;
        }
        {% include "_primary_nav_styles.html" %}
        .button {
            font: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            min-height: 2.4rem;
            border: 1px solid var(--accent);
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: var(--accent-fg);
            padding: 0.55rem 0.8rem;
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.12s ease, border-color 0.12s ease, transform 0.12s ease;
        }
        .button:active { transform: scale(0.98); }
        .button:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            text-decoration: none;
        }
        .button.secondary {
            background: transparent;
            color: var(--text);
            border-color: var(--border-strong);
        }
        .button.secondary:hover {
            background: var(--surface-2);
            border-color: var(--border-strong);
        }
        .button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            transform: none;
        }
        main {
            width: min(760px, 100%);
            margin: 0 auto;
            padding: 1.25rem 1rem calc(2rem + var(--safe-bottom));
        }
        .settings-header {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .section-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 0 0 0.35rem;
        }
        .settings-header h1 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 650;
        }
        .settings-form {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 1rem;
        }
        .settings-form label {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-muted);
        }
        .settings-form label.checkbox-label {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            color: var(--text);
            gap: 0.75rem;
            min-height: 2.4rem;
            border-top: 1px solid var(--border);
            padding-top: 1rem;
        }
        .settings-form input[type="checkbox"] {
            width: 1.1rem;
            height: 1.1rem;
            accent-color: var(--accent);
            flex: 0 0 auto;
        }
        .settings-form textarea,
        .settings-form select,
        .settings-form input[type="text"] {
            width: 100%;
            font: inherit;
            font-size: 0.95rem;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            padding: 0.65rem 0.75rem;
            background: var(--surface);
            color: var(--text);
            transition: border-color 0.12s ease, box-shadow 0.12s ease;
        }
        .settings-form textarea:focus,
        .settings-form select:focus,
        .settings-form input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .settings-form textarea {
            min-height: 5rem;
            resize: vertical;
            line-height: 1.5;
        }
        .settings-link-row,
        .settings-form .actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .settings-link-row {
            justify-content: flex-start;
        }
        .settings-form .actions {
            flex-direction: column;
            align-items: flex-end;
            justify-content: flex-end;
            border-top: 1px solid var(--border);
            padding-top: 1rem;
        }
        .settings-form .actions .button {
            min-width: 7rem;
        }
        {% include "_dialog_styles.html" %}
        @media (max-width: 480px) {
            .topbar-inner { padding: 0.7rem 1rem; }
            .settings-link-row,
            .settings-form .actions {
                flex-direction: column;
            }
            .settings-link-row .button,
            .settings-form .actions .button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="topbar-leading">
                {% include "_primary_nav.html" %}
                <p class="brand">HITCH</p>
            </div>
        </div>
    </header>
    <main>
        <header class="settings-header">
            <p class="section-label">Account</p>
            <h1>Settings</h1>
        </header>
        {% include "_settings_form.html" %}
    </main>
    {% include "_project_edit_dialog.html" %}
    <script>document.documentElement.classList.add("js");</script>
    <script>
        (function () {
            const modalScrollLockClass = "modal-scroll-locked";
            function syncModalScrollLock() {
                const hasOpenDialog = Boolean(document.querySelector("dialog[open]"));
                document.documentElement.classList.toggle(modalScrollLockClass, hasOpenDialog);
                document.body.classList.toggle(modalScrollLockClass, hasOpenDialog);
            }
            function showDialog(dialog) {
                if (!dialog) return;
                if (typeof dialog.showModal === "function") {
                    dialog.showModal();
                } else {
                    dialog.setAttribute("open", "");
                }
                syncModalScrollLock();
            }
            function hideDialog(dialog) {
                if (!dialog) return;
                if (typeof dialog.close === "function") {
                    dialog.close();
                } else {
                    dialog.removeAttribute("open");
                }
                syncModalScrollLock();
            }
            for (const dialog of document.querySelectorAll("dialog")) {
                dialog.addEventListener("close", syncModalScrollLock);
            }

            {% include "_primary_nav_script.html" %}
            {% include "_project_edit_script.html" %}
        })();
    </script>
</body>
</html>
