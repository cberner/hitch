<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f2e8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#161c1a" media="(prefers-color-scheme: dark)">
    <title>Settings - HITCH</title>
{% include "_js_class_bootstrap.html" %}
    <style>
        {% include "_color_tokens.html" %}
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: saturate(180%) blur(14px);
            -webkit-backdrop-filter: saturate(180%) blur(14px);
            border-bottom: 1px solid var(--border);
            padding-top: var(--safe-top);
        }
        .topbar-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
        }
        .topbar-leading {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            min-width: 0;
        }
        .brand {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            margin: 0;
        }
        {% include "_primary_nav_styles.html" %}
        {% include "_button_styles.html" %}
        main {
            width: min(900px, 100%);
            margin: 0 auto;
            padding: 1.25rem 1rem calc(2rem + var(--safe-bottom));
        }
        .settings-header {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .section-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 0 0 0.35rem;
        }
        .settings-header h1 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 650;
        }
        .settings-form {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 1rem;
        }
        .settings-form label {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-muted);
        }
        .settings-form label.checkbox-label {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            color: var(--text);
            gap: 0.75rem;
            min-height: 2.4rem;
            border-top: 1px solid var(--border);
            padding-top: 1rem;
        }
        .settings-form input[type="checkbox"] {
            width: 1.1rem;
            height: 1.1rem;
            accent-color: var(--accent);
            flex: 0 0 auto;
        }
        .settings-form textarea,
        .settings-form select,
        .settings-form input[type="number"],
        .settings-form input[type="text"] {
            width: 100%;
            font: inherit;
            font-size: 0.95rem;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            padding: 0.65rem 0.75rem;
            background: var(--surface);
            color: var(--text);
            transition: border-color 0.12s ease, box-shadow 0.12s ease;
        }
        .settings-form textarea:focus,
        .settings-form select:focus,
        .settings-form input[type="number"]:focus,
        .settings-form input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .settings-form textarea {
            min-height: 5rem;
            resize: vertical;
            line-height: 1.5;
        }
        .settings-link-row,
        .settings-form .actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .settings-link-row {
            justify-content: flex-start;
        }
        .settings-form .actions {
            flex-direction: column;
            align-items: flex-end;
            justify-content: flex-end;
            border-top: 1px solid var(--border);
            padding-top: 1rem;
        }
        .settings-form .actions .button {
            min-width: 7rem;
        }
        {% include "_dialog_styles.html" %}
        @media (max-width: 480px) {
            .topbar-inner { padding: 0.7rem 1rem; }
            .settings-link-row,
            .settings-form .actions {
                flex-direction: column;
            }
            .settings-link-row .button,
            .settings-form .actions .button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="topbar-leading">
                {% include "_primary_nav.html" %}
                <h1 class="brand">HITCH</h1>
            </div>
        </div>
    </header>
    <main>
        <header class="settings-header">
            <p class="section-label">Account</p>
            <h1>Settings</h1>
        </header>
        {% include "_settings_form.html" %}
    </main>
    {% include "_project_edit_dialog.html" %}
    <script>
        (function () {
            {% include "_dialog_script.html" %}
            {% include "_primary_nav_script.html" %}
            {% include "_project_edit_script.html" %}
            {% include "_settings_effort_script.html" %}
        })();
    </script>
</body>
</html>
