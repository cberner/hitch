<nav class="primary-nav" aria-label="Primary" data-nav-menu>
    <button type="button" class="primary-nav-toggle" aria-label="Navigation menu" aria-haspopup="true" aria-expanded="false" data-nav-menu-open>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
    </button>
    <div class="primary-nav-panel" data-nav-menu-panel>
        {% with current_route=request.resolver_match.url_name %}
        <span class="primary-nav-session-item">
            <a class="primary-nav-session-link" href="{% url 'index' %}"{% if current_route == "index" %} aria-current="page"{% endif %}>sessions</a>
            <a class="primary-nav-new-session" href="{% url 'new_session' %}"{% if current_route == "new_session" %} aria-current="page"{% endif %} aria-label="New session">
                <span aria-hidden="true">+</span>
            </a>
        </span>
        <a class="primary-nav-with-badge" href="{% url 'inbox' %}"{% if current_route == "inbox" %} aria-current="page"{% endif %}>
            <span>inbox</span>
            {% if inbox_count %}<span class="primary-nav-badge" aria-label="{{ inbox_count }} inbox message{{ inbox_count|pluralize }}">{{ inbox_count }}</span>{% endif %}
        </a>
        {% if current_project %}
        <a href="{% url 'autonomous_goals' %}"{% if current_route == "autonomous_goals" %} aria-current="page"{% endif %}>auto goals</a>
        {% endif %}
        <a href="{{ settings_url }}{% if current_route != 'update_settings' %}?next={{ request.get_full_path|urlencode }}{% endif %}"{% if current_route == "update_settings" %} aria-current="page"{% endif %}>settings</a>
        <a class="primary-nav-account"
           href="{% url 'profile' %}"
           title="{% if user.is_authenticated %}{{ user.get_username }}{% else %}anonymous{% endif %}"{% if current_route == "profile" %} aria-current="page"{% endif %}>{% if user.is_authenticated %}{{ user.get_username }}{% else %}anonymous{% endif %}</a>
        {% endwith %}
    </div>
</nav>
