<nav class="primary-nav" aria-label="Primary" data-nav-menu>
    <button type="button" class="primary-nav-toggle" aria-label="Navigation menu" aria-haspopup="true" aria-expanded="false" data-nav-menu-open>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
    </button>
    <div class="primary-nav-panel" data-nav-menu-panel>
        <a href="{% url 'index' %}#new-session" data-new-session-open>new session</a>
        {% with current_route=request.resolver_match.url_name %}
        <a href="{% url 'index' %}"{% if current_route == "index" %} aria-current="page"{% endif %}>sessions</a>
        <a href="{% url 'system_sessions' %}"{% if current_route == "system_sessions" or current_route == "system_session" %} aria-current="page"{% endif %}>system sessions</a>
        {% if current_project %}
        <a href="{% url 'standing_orders' %}"{% if current_route == "standing_orders" %} aria-current="page"{% endif %}>standing orders</a>
        <a href="{% url 'okrs' %}"{% if current_route == "okrs" %} aria-current="page"{% endif %}>OKRs</a>
        {% endif %}
        <a href="{% url 'usage' %}"{% if current_route == "usage" %} aria-current="page"{% endif %}>usage</a>
        {% endwith %}
        <button type="button" data-settings-open>settings</button>
        {% if user.is_authenticated %}
        <form class="logout-form" method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Log out</button>
        </form>
        {% endif %}
        {% if server_git_hash %}
        <span class="primary-nav-revision" title="Server git revision">{{ server_git_hash }}</span>
        {% endif %}
    </div>
</nav>
