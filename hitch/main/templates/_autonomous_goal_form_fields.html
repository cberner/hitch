<label>
    Title
    <input type="text" name="title" maxlength="{{ title_max_len }}" required autocomplete="off"{% if title_input_attrs %} {{ title_input_attrs }}{% endif %}>
</label>
<label>
    Goal
    <textarea name="goal" required></textarea>
</label>
<label>
    Ambition
    <select name="ambition" required>
        {% for value, label in ambition_choices %}
        <option value="{{ value }}"{% if value == default_ambition %} selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
</label>
<label>
    Autonomy
    <select name="autonomy" required data-autonomous-goal-autonomy>
        {% for value, label in autonomy_choices %}
        <option value="{{ value }}"{% if value == default_autonomy %} selected{% endif %} data-auto-qa-supported="{% if value in auto_qa_supported_autonomies %}true{% else %}false{% endif %}">{{ label }}</option>
        {% endfor %}
    </select>
</label>
<label class="checkbox-label" data-autonomous-goal-auto-qa-field>
    <span>Auto-QA</span>
    <input type="hidden" name="auto_qa" value="false">
    <input type="checkbox" name="auto_qa" value="true" data-autonomous-goal-auto-qa {% if default_auto_qa %}checked{% endif %}{% if default_autonomy in auto_qa_supported_autonomies %}{% else %} disabled{% endif %}>
</label>
<label class="checkbox-label">
    Auto-proposal
    <input type="hidden" name="auto_proposal" value="false">
    <input type="checkbox" name="auto_proposal" value="true" {% if default_auto_proposal %}checked{% endif %}>
</label>
<label>
    Confidence threshold
    <select name="confidence_threshold" required>
        {% for value, label in confidence_choices %}
        <option value="{{ value }}"{% if value == default_confidence %} selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
</label>
<label>
    Web search
    <select name="web_search_mode">
        {% for value, label in web_search_mode_choices %}
        <option value="{{ value }}"{% if value == default_web_search_mode %} selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
</label>
<label class="checkbox-label">
    <span>Auto merge to local branch</span>
    <input type="hidden" name="auto_merge_to_local_branch" value="false">
    <input type="checkbox" name="auto_merge_to_local_branch" value="true" data-autonomous-goal-auto-merge>
</label>
<label>
    Local branch
    <select name="auto_merge_branch" data-autonomous-goal-auto-merge-branch>
        <option value="">Select branch</option>
        {% for branch in local_branch_choices %}
        <option value="{{ branch }}">{{ branch }}</option>
        {% endfor %}
    </select>
</label>
