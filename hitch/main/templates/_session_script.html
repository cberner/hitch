                    entry.reasoningContent = reasoningParts(item.content);
                }
                items.set(item.id, entry);
                followRenderedContent();
            }

            function ensurePlanView(turnId, itemId) {
                const key = turnId || itemId || "active";
                let view = planViews.get(key);
                if (!view && itemId) view = planViews.get(itemId);
                if (!view && turnId) view = planViews.get(turnId);
                if (!view) {
                    const wrap = document.createElement("div");
                    wrap.className = "entry";
                    if (itemId) wrap.dataset.itemId = itemId;
                    const card = document.createElement("div");
                    card.className = "plan-card";
                    const header = document.createElement("div");
                    header.className = "plan-header";
                    header.textContent = "Plan";
                    const explanation = document.createElement("div");
                    explanation.className = "plan-explanation";
                    explanation.hidden = true;
                    const list = document.createElement("ol");
                    list.className = "plan-checklist";
                    list.hidden = true;
                    const text = document.createElement("div");
                    text.className = "plan-text";
                    text.hidden = true;
                    card.appendChild(header);
                    card.appendChild(explanation);
                    card.appendChild(list);
                    card.appendChild(text);
                    wrap.appendChild(card);
                    insertBeforeLive(wrap);
                    view = { node: wrap, explanation, list, text, textRaw: "" };
                    planViews.set(key, view);
                    followRenderedContent();
                }
                if (turnId) planViews.set(turnId, view);
                if (itemId) planViews.set(itemId, view);
                if (itemId) {
                    view.node.dataset.itemId = itemId;
                    items.set(itemId, { kind: "plan", node: view.node, view });
                }
                return view;
            }

            function renderPlanItem(item, turnId, timestampSeconds) {
                const view = ensurePlanView(turnId, item.id);
                ensurePlanTimestamp(view, timestampSeconds);
                if (item.text) activateFinalPlanText(view);
                view.textRaw = item.text || view.textRaw || "";
                renderPlanText(view);
                followRenderedContent();
            }

            function ensurePlanTimestamp(view, timestampSeconds) {
                const header = view.node.querySelector(".plan-header");
                if (header && !header.querySelector("time[data-ts]")) {
                    header.appendChild(timestampElement(timestampSeconds, ""));
                }
            }

            function activateFinalPlanText(view) {
                view.explanation.textContent = "";
                view.explanation.hidden = true;
                view.list.replaceChildren();
                view.list.hidden = true;
            }

            function renderPlanText(view) {
                const text = view.textRaw.trim();
                view.text.textContent = text;
                view.text.hidden = !text || !view.list.hidden;
            }

            function renderPlanSteps(view, steps) {
                view.list.replaceChildren();
                for (const step of steps) {
                    const text = planStepText(step);
                    if (!text) continue;
                    const li = document.createElement("li");
                    const status = normalizePlanStatus(step && step.status);
                    li.className = "plan-step " + status;
                    li.textContent = text;
                    view.list.appendChild(li);
                }
                view.list.hidden = view.list.children.length === 0;
                renderPlanText(view);
            }

            function normalizePlanStatus(status) {
                if (status === "completed") return "completed";
                if (status === "inProgress" || status === "in_progress") return "inProgress";
                return "pending";
            }

            function planStepText(step) {
                return step && typeof step.step === "string" ? step.step.trim() : "";
            }

            function currentTaskText(steps) {
                const clean = steps
                    .map((step) => ({
                        text: planStepText(step),
                        status: normalizePlanStatus(step && step.status),
                    }))
                    .filter((step) => step.text);
                if (!clean.length) return "";
                const active = clean.find((step) => step.status === "inProgress")
                    || clean.find((step) => step.status === "pending")
                    || clean[clean.length - 1];
                return active ? active.text : "";
            }

            function updateTaskPlan(payload) {
                if (!taskPlan || !taskPlanCurrent || !taskPlanExplanation || !taskPlanList) return;
                const steps = Array.isArray(payload && payload.plan) ? payload.plan : [];
                const explanation = typeof payload.explanation === "string"
                    ? payload.explanation.trim()
                    : "";
                taskPlanExplanation.textContent = explanation;
                taskPlanExplanation.hidden = !explanation;
                taskPlanList.replaceChildren();
                for (const step of steps) {
                    const text = planStepText(step);
                    if (!text) continue;
                    const li = document.createElement("li");
                    li.className = "plan-step " + normalizePlanStatus(step && step.status);
                    li.textContent = text;
                    taskPlanList.appendChild(li);
                }
                taskPlanList.hidden = taskPlanList.children.length === 0;
                const current = currentTaskText(steps) || explanation;
                taskPlanCurrent.textContent = current;
                setTaskPlanVisible(!!current || !!taskPlanList.children.length);
            }

            if (taskPlan && taskPlanToggle) {
                taskPlanToggle.addEventListener("click", () => {
                    const expanded = taskPlan.dataset.expanded !== "true";
                    taskPlan.dataset.expanded = expanded ? "true" : "false";
                    taskPlanToggle.setAttribute("aria-expanded", expanded ? "true" : "false");
                });
            }

            function setTaskPlanVisible(visible) {
                if (!taskPlan) return;
                taskPlan.hidden = !visible;
                if (sessionMain) sessionMain.classList.toggle("has-task-plan", visible);
            }

            function reasoningParts(value) {
                if (Array.isArray(value)) {
                    return value.map((part) => typeof part === "string" ? part : "");
                }
                return typeof value === "string" ? [value] : [];
            }

            function firstReasoningText(summary, content) {
                for (const parts of [summary, content]) {
                    for (const part of parts) {
                        if (part.trim()) return part.trim().split("\n", 1)[0];
                    }
                }
                return "";
            }

            function reasoningSnapshotText(item) {
                const text = firstReasoningText(
                    reasoningParts(item.summary),
                    reasoningParts(item.content)
                );
                if (text) return text;
                return typeof item.text === "string" ? item.text.trim().split("\n", 1)[0] : "";
            }

            function rawToolDetail(item) {
                switch (item.type) {
                    case "commandExecution": return item.command || "";
                    case "mcpToolCall": return (item.server || "") + " / " + (item.tool || "");
                    case "fileChange":
                        const paths = (item.changes || []).map((c) => c.path).filter(Boolean);
                        if (!paths.length) return "";
                        return paths.length === 1 ? paths[0] : paths[0] + " (+" + (paths.length - 1) + " more)";
                    case "webSearch": return item.query || "";
                    case "plan": return (item.text || "").split("\n", 1)[0];
                    case "imageView": return item.path || "";
                    case "imageGeneration": return item.revisedPrompt || item.savedPath || "";
                    case "reasoning": return reasoningSnapshotText(item);
                    default: return "";
                }
            }

            // All text written to live tool-detail nodes crosses this policy boundary.
            function toolDetail(item) {
                return SANITIZE_LIVE_DETAILS
                    ? sanitizedToolDetail(item)
                    : rawToolDetail(item);
            }

            function handleItemStarted(payload, event) {
                ensureNoEmpty();
                const item = payload.item || {};
                if (!item.id) return;
                if (HIDE_LIVE_TRANSCRIPT) return;
                if (items.has(item.id)) {
                    if (item.type === "plan") {
                        const entry = items.get(item.id);
                        if (entry && entry.kind === "plan") {
                            ensurePlanTimestamp(entry.view, timestampSecondsForEvent(event));
                        }
                    }
                    return;
                }
                const timestampSeconds = timestampSecondsForEvent(event);
                switch (item.type) {
                    case "userMessage":
                        if (!HIDE_LIVE_USER_MESSAGE) renderUserItem(item, timestampSeconds);
                        break;
                    case "agentMessage": renderAgentItem(item, timestampSeconds); break;
                    case "plan": renderPlanItem(item, payload.turnId, timestampSeconds); break;
                    default: renderToolCallItem(item, timestampSeconds); break;
                }
            }

            function handleAgentDelta(payload) {
                const entry = items.get(payload.itemId);
                if (!entry || entry.kind !== "agent") return;
                entry.body.textContent += payload.delta || "";
                followRenderedContent();
            }

            function handleReasoningDelta(payload, partsKey, indexKey) {
                const entry = items.get(payload.itemId);
                if (!entry || entry.kind !== "tool" || !entry.detail) return;
                const delta = typeof payload.delta === "string" ? payload.delta : "";
                if (!delta) return;
                const rawIndex = Number(payload[indexKey]);
                const index = Number.isSafeInteger(rawIndex) && rawIndex >= 0 ? rawIndex : 0;
                const parts = Array.isArray(entry[partsKey]) ? entry[partsKey] : [];
                while (parts.length <= index) parts.push("");
                parts[index] += delta;
                entry[partsKey] = parts;
                entry.detail.textContent = toolDetail({
                    type: "reasoning",
                    summary: entry.reasoningSummary || [],
                    content: entry.reasoningContent || [],
                });
                followRenderedContent();
            }

            function handlePlanDelta(payload, event) {
                if (HIDE_LIVE_TRANSCRIPT) return;
                const itemId = payload.itemId;
                if (!itemId) return;
                const entry = items.get(itemId);
                const view = entry && entry.kind === "plan"
                    ? entry.view
                    : ensurePlanView(payload.turnId, itemId);
                ensurePlanTimestamp(view, timestampSecondsForEvent(event));
                activateFinalPlanText(view);
                view.textRaw += payload.delta || "";
                renderPlanText(view);
                followRenderedContent();
            }

            function handleItemCompleted(payload, event) {
                const item = payload.item || {};
                if (HIDE_LIVE_TRANSCRIPT) return;
                if (HIDE_LIVE_USER_MESSAGE && item.type === "userMessage") return;
                const entry = items.get(item.id);
                if (!entry) {
                    // Item that completed without a prior started event —
                    // render now so the user still sees it. A frame with no
                    // usable id can't be registered by handleItemStarted, so
                    // guard against recursing forever on it.
                    if (!item.id) return;
                    handleItemStarted(payload, event);
                    if (!items.has(item.id)) return;
                    return handleItemCompleted(payload, event);
                }
                if (entry.kind === "agent" && item.type === "agentMessage") {
                    entry.body.textContent = item.text || entry.body.textContent;
                    setMemoryCitation(entry.message, item.memoryCitation || item.memory_citation);
                    entry.message.classList.remove("streaming");
                    if (item.phase === "commentary") {
                        entry.message.classList.remove("agent");
                        entry.message.classList.add("thinking");
                        const role = entry.node.querySelector(".role");
                        if (role) role.textContent = "Agent (thinking)";
                    }
                    followRenderedContent();
                    return;
                }
                if (entry.kind === "plan" && item.type === "plan") {
                    ensurePlanTimestamp(entry.view, timestampSecondsForEvent(event));
                    activateFinalPlanText(entry.view);
                    entry.view.textRaw = item.text || entry.view.textRaw;
                    renderPlanText(entry.view);
                    followRenderedContent();
                    return;
                }
                if (entry.kind === "tool" && entry.statusNode) {
                    if (item.type === "reasoning") {
                        entry.reasoningSummary = reasoningParts(item.summary);
                        entry.reasoningContent = reasoningParts(item.content);
                    }
                    const status = readStatus(item);
                    entry.statusNode.classList.remove("inProgress");
                    if (status && status !== "completed") {
                        entry.statusNode.classList.add(status);
                        entry.statusNode.textContent = status;
                    } else {
                        entry.statusNode.remove();
                        entry.statusNode = null;
                    }
                    const detail = toolDetail(item);
                    if (detail && entry.detail) entry.detail.textContent = detail;
                    if (
                        entry.rowNode
                        && !entry.statusNode
                        && entry.detail
                        && !entry.detail.textContent.trim()
                    ) {
                        entry.rowNode.remove();
                        entry.rowNode = null;
                    }
                }
                followRenderedContent();
            }

            function readStatus(item) {
                if (typeof item.status === "string") return item.status;
                if (item.status && typeof item.status === "object" && item.status.value) return item.status.value;
                return null;
            }

            function setGoal(objective) {
                if (!liveGoal || !liveGoalText) return;
                const text = typeof objective === "string" ? objective.trim() : "";
                liveGoalText.textContent = text;
                liveGoal.hidden = !text;
            }

            function eventOrder(event, fallbackOrder) {
                return [
                    Number.isSafeInteger(event.recordedAt) ? event.recordedAt : 0,
                    Number.isSafeInteger(event.eventSeq) ? event.eventSeq : 0,
                    fallbackOrder,
                ];
            }

            // Compare the leading `levels` of two [recordedAt, eventSeq,
            // fallbackOrder] tuples; an order ties-or-wins (newer) unless it is
            // strictly behind on the first differing level. Goal updates compare
            // 2 levels (no fallback tiebreak); task-plan updates compare 3.
            function isOrderNewer(order, latest, levels) {
                for (let i = 0; i < levels; i += 1) {
                    if (order[i] < latest[i]) return false;
                    if (order[i] > latest[i]) return true;
                }
                return true;
            }

            function applyGoalOrder(order) {
                if (!isOrderNewer(order, latestGoalOrder, 2)) return false;
                latestGoalOrder = order;
                return true;
            }

            function applyTaskPlanOrder(order) {
                if (!isOrderNewer(order, latestTaskPlanOrder, 3)) return false;
                latestTaskPlanOrder = order;
                return true;
            }

            function handleGoalUpdated(payload, order) {
                if (!applyGoalOrder(order)) return;
                const goal = (payload && payload.goal) || {};
                setGoal(goal.objective || "");
            }

            function handleGoalCleared(order) {
                if (!applyGoalOrder(order)) return;
                setGoal("");
            }

            function handlePlanUpdated(payload, order) {
                if (!applyTaskPlanOrder(order)) return;
                updateTaskPlan(payload);
                followRenderedContent();
            }

            function handleApprovalRequested(payload) {
                ensureNoEmpty();
                const id = payload.id;
                if (id == null || approvals.has(id)) return;
                const wrap = document.createElement("div");
                wrap.className = "entry";
                wrap.dataset.approvalId = String(id);
                const box = document.createElement("div");
                box.className = "approval";
                const header = document.createElement("div");
                header.className = "approval-header";
                header.textContent = APPROVAL_LABELS[payload.method] || "Approval requested";
                box.appendChild(header);
                const detail = document.createElement("div");
                detail.className = "approval-detail";
                detail.textContent = SANITIZE_LIVE_DETAILS
                    ? sanitizedApprovalDetail(payload.method, payload.params)
                    : approvalDetail(payload.method, payload.params);
                box.appendChild(detail);
                if (READ_ONLY) {
                    wrap.appendChild(box);
                    insertBeforeLive(wrap);
                    approvals.set(id, { node: wrap, box, actions: null, resolved: false });
                    followRenderedContent();
                    return;
                }
                const actions = document.createElement("div");
                actions.className = "approval-actions";
                const buttons = [
                    { decision: "accept", label: "Run" },
                    { decision: "cancel", label: "Cancel" },
                ];
                const amendmentDecision = execpolicyAmendmentDecision(payload.params);
                if (amendmentDecision) {
                    buttons.splice(1, 0, {
                        decision: "accept",
                        label: "Run and remember",
                        decisionPayload: amendmentDecision,
                    });
                }
                buttons.splice(buttons.length - 1, 0, { decision: "decline", label: "Skip" });
                for (const { decision, label, decisionPayload } of buttons) {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.dataset.decision = decision;
                    btn.textContent = label;
                    btn.addEventListener("click", () => submitApproval(id, decision, decisionPayload));
                    actions.appendChild(btn);
                }
                box.appendChild(actions);
                wrap.appendChild(box);
                insertBeforeLive(wrap);
                approvals.set(id, { node: wrap, box, actions, resolved: false, reloadOnResolve: false });
                followRenderedContent();
            }

            function inputAnswerPresent(value) {
                if (typeof value === "string") return value.trim().length > 0;
                if (Array.isArray(value)) return value.length > 0;
                if (value && typeof value === "object") return Object.keys(value).length > 0;
                return value != null;
            }

            function handleInputRequested(payload) {
                ensureNoEmpty();
                const id = payload.id;
                if (id == null || inputRequests.has(id)) return;
                const params = payload.params || {};
                const questions = Array.isArray(params.questions) ? params.questions : [];
                const wrap = document.createElement("div");
                wrap.className = "entry";
                wrap.dataset.inputRequestId = String(id);
                const box = document.createElement("div");
                box.className = "input-request";
                const header = document.createElement("div");
                header.className = "input-request-header";
                header.textContent = "Input requested";
                box.appendChild(header);
                if (READ_ONLY) {
                    for (const question of questions) {
                        const qid = typeof question.id === "string" ? question.id : "";
                        if (!qid) continue;
                        const qbox = document.createElement("div");
                        qbox.className = "input-question";
                        const qheader = document.createElement("div");
                        qheader.className = "input-question-header";
                        qheader.textContent = typeof question.header === "string" ? question.header : "";
                        if (qheader.textContent) qbox.appendChild(qheader);
                        const title = document.createElement("div");
                        title.className = "input-question-title";
                        title.textContent = typeof question.question === "string" ? question.question : qid;
                        qbox.appendChild(title);
                        box.appendChild(qbox);
                    }
                    wrap.appendChild(box);
                    insertBeforeLive(wrap);
                    inputRequests.set(id, {
                        node: wrap,
                        box,
                        actions: null,
                        answers: {},
                        resolved: false,
                    });
                    followRenderedContent();
                    return;
                }
                const answers = {};
                const requiredQuestionIds = [];
                let refreshSubmitState = () => {};
                for (const question of questions) {
                    const qid = typeof question.id === "string" ? question.id : "";
                    if (!qid) continue;
                    const requiresExplicitChoice = question.requires_explicit_choice === true;
                    if (requiresExplicitChoice) requiredQuestionIds.push(qid);
                    const qbox = document.createElement("div");
                    qbox.className = "input-question";
                    const qheader = document.createElement("div");
                    qheader.className = "input-question-header";
                    qheader.textContent = typeof question.header === "string" ? question.header : "";
                    if (qheader.textContent) qbox.appendChild(qheader);
                    const title = document.createElement("div");
                    title.className = "input-question-title";
                    title.textContent = typeof question.question === "string" ? question.question : qid;
                    qbox.appendChild(title);
                    const options = Array.isArray(question.options) ? question.options : [];
                    const optionRow = document.createElement("div");
                    optionRow.className = "input-options";
                    const buttons = [];
                    const setAnswer = (value, selected) => {
                        if (inputAnswerPresent(value)) {
                            answers[qid] = value;
                        } else {
                            delete answers[qid];
                        }
                        for (const btn of buttons) btn.setAttribute("aria-pressed", "false");
                        if (selected) selected.setAttribute("aria-pressed", "true");
                        refreshSubmitState();
                    };
                    for (const option of options) {
                        const label = typeof option.label === "string" ? option.label : "";
                        if (!label) continue;
                        const btn = document.createElement("button");
                        btn.type = "button";
                        btn.setAttribute("aria-pressed", "false");
                        const labelNode = document.createElement("span");
                        labelNode.className = "input-option-label";
                        labelNode.textContent = label;
                        btn.appendChild(labelNode);
                        const description = typeof option.description === "string"
                            ? option.description.trim()
                            : "";
                        if (description) {
                            const descriptionNode = document.createElement("span");
                            descriptionNode.className = "input-option-description";
                            descriptionNode.textContent = description;
                            btn.appendChild(descriptionNode);
                        }
                        btn.addEventListener("click", () => setAnswer(label, btn));
                        optionRow.appendChild(btn);
                        buttons.push(btn);
                    }
                    const other = document.createElement("input");
                    other.type = "text";
                    other.className = "input-other";
                    other.placeholder = "Other";
                    other.setAttribute("aria-label", "Other answer for " + qid);
                    // Focusing the empty Other field must not wipe a selected
                    // option; only adopt its text once it actually has content
                    // (re-selecting an already-filled Other, or as the user
                    // types via the input handler below).
                    other.addEventListener("focus", () => {
                        if (inputAnswerPresent(other.value)) setAnswer(other.value, null);
                    });
                    other.addEventListener("input", () => setAnswer(other.value, null));
                    optionRow.appendChild(other);
                    if (buttons.length && !requiresExplicitChoice) {
                        const firstLabel = buttons[0].querySelector(".input-option-label");
                        setAnswer(firstLabel ? firstLabel.textContent || "" : "", buttons[0]);
                    }
                    qbox.appendChild(optionRow);
                    box.appendChild(qbox);
                }
                const actions = document.createElement("div");
                actions.className = "input-request-actions";
                const submit = document.createElement("button");
                submit.type = "button";
                submit.dataset.submitInput = "true";
                submit.textContent = "Submit";
                submit.addEventListener("click", () => submitInputRequest(id));
                actions.appendChild(submit);
                refreshSubmitState = () => {
                    submit.disabled = requiredQuestionIds.some((qid) => {
                        return !inputAnswerPresent(answers[qid]);
                    });
                };
                refreshSubmitState();
                if (!requiredQuestionIds.length) {
                    const skip = document.createElement("button");
                    skip.type = "button";
                    skip.textContent = "Skip";
                    skip.addEventListener("click", () => {
                        const entry = inputRequests.get(id);
                        if (entry) {
                            for (const key of Object.keys(entry.answers)) {
                                delete entry.answers[key];
                            }
                        }
                        submitInputRequest(id);
                    });
                    actions.appendChild(skip);
                }
                box.appendChild(actions);
                wrap.appendChild(box);
                insertBeforeLive(wrap);
                inputRequests.set(id, { node: wrap, box, actions, answers, requiredQuestionIds, resolved: false });
                followRenderedContent();
            }

            function submitApproval(id, decision, decisionPayload) {
                const entry = approvals.get(id);
                if (!entry || !entry.actions) return;
                const reenable = () => {
                    for (const btn of entry.actions.querySelectorAll("button")) {
                        btn.disabled = false;
                    }
                };
                for (const btn of entry.actions.querySelectorAll("button")) {
                    btn.disabled = true;
                }
                const body = new URLSearchParams({ decision });
                if (decisionPayload) body.set("decision_payload", JSON.stringify(decisionPayload));
                // Swap the placeholder pk Django emits via
                // ``reverse('resolve_approval', kwargs={'approval_id': 0})``
                // for the real ApprovalRequest id. The regex anchors on the
                // trailing ``/0/`` so a future URL prefix that happens to
                // contain a ``0`` doesn't accidentally substitute there.
                const url = entry.url || APPROVAL_URL_TEMPLATE.replace(/\/0\/?$/, "/" + id + "/");
                window.hitch.postForm(url, body).then((response) => {
                    // ``fetch`` resolves on HTTP errors (403 CSRF, 409
                    // race-with-another-tab), so a non-2xx response would
                    // otherwise leave the buttons permanently disabled
                    // with no retry path. The 409 case is intentional —
                    // the row is already decided, and the matching
                    // ``approval/resolved`` SSE frame will fold the UI;
                    // for everything else, re-enable so the user can try
                    // again.
                    if (response.ok && entry.reloadOnResolve) {
                        window.location.reload();
                        return;
                    }
                    if (!response.ok && response.status !== 409) reenable();
                }).catch(() => {
                    // Network failure (no response). The approval/resolved
                    // event from the worker is the canonical signal that a
                    // decision took effect, so re-enabling here is safe.
                    reenable();
                });
            }

            function submitInputRequest(id) {
                const entry = inputRequests.get(id);
                if (!entry || entry.resolved) return;
                if (Array.isArray(entry.requiredQuestionIds)) {
                    const missingRequired = entry.requiredQuestionIds.some((qid) => {
                        return !inputAnswerPresent((entry.answers || {})[qid]);
                    });
                    if (missingRequired) return;
                }
                const controls = entry.box.querySelectorAll("button, input");
                for (const btn of controls) btn.disabled = true;
                const body = new URLSearchParams({ answers: JSON.stringify(entry.answers || {}) });
                const url = INPUT_URL_TEMPLATE.replace(/\/0\/?$/, "/" + id + "/");
                window.hitch.postForm(url, body).then((response) => {
                    if (!response.ok && response.status !== 409) {
                        for (const btn of controls) btn.disabled = false;
                    }
                }).catch(() => {
                    for (const btn of controls) btn.disabled = false;
                });
            }

            function handleApprovalResolved(payload) {
                const id = payload.id;
                const entry = approvals.get(id);
                if (!entry) return;
                if (entry.resolved) return;
                entry.resolved = true;
                entry.box.classList.add("resolved");
                if (entry.actions && entry.actions.parentNode) entry.actions.remove();
                const note = document.createElement("div");
                note.className = "approval-resolution";
                note.textContent = "Decision: " + approvalDecisionText(payload.decision);
                entry.box.appendChild(note);
                followRenderedContent();
            }

            function handleInputResolved(payload) {
                const id = payload.id;
                const entry = inputRequests.get(id);
                if (!entry || entry.resolved) return;
                entry.resolved = true;
                entry.box.classList.add("resolved");
                for (const control of entry.box.querySelectorAll("button, input")) {
                    control.disabled = true;
                }
                if (entry.actions && entry.actions.parentNode) entry.actions.remove();
                const note = document.createElement("div");
                note.className = "approval-resolution";
                note.textContent = "Answers submitted";
                entry.box.appendChild(note);
                followRenderedContent();
            }

            const seenEvents = new Set();

            function eventKey(event) {
                const recordedAt = Number.isSafeInteger(event.recordedAt) ? event.recordedAt : null;
                const eventSeq = Number.isSafeInteger(event.eventSeq) ? event.eventSeq : null;
                if (recordedAt === null && eventSeq === null) return "";
                return [
                    recordedAt === null ? "" : recordedAt,
                    eventSeq === null ? "" : eventSeq,
                    event.method || "",
                ].join(":");
            }

            function handleHeartbeat(event) {
                bump();
                let payload;
                try { payload = JSON.parse(event.data); } catch { payload = {}; }
                if (payload && typeof payload.statusText === "string" && payload.statusText.trim()) {
                    workingText = payload.statusText.trim();
                }
                if (payload && Array.isArray(payload.prWorkflowProgress)) {
                    renderPrProgress(payload.prWorkflowProgress);
                }
                setState(payload && payload.working ? "working" : "idle");
            }

            function renderPrProgress(gates) {
                if (!prProgress) return;
                prProgress.replaceChildren();
                const validGates = gates.filter((gate) => {
                    return gate
                        && typeof gate.key === "string"
                        && typeof gate.label === "string"
                        && typeof gate.status === "string";
                });
                prProgress.hidden = validGates.length === 0;
                for (const gate of validGates) {
                    const item = document.createElement("span");
                    item.className = "pr-gate";
                    item.dataset.prGate = gate.key;
                    item.dataset.status = gate.status;
                    if (typeof gate.summary === "string") item.title = gate.summary;
                    const statusLabel = typeof gate.statusLabel === "string"
                        ? gate.statusLabel
                        : gate.status;
                    item.setAttribute("aria-label", `${gate.label}: ${statusLabel}`);
                    item.textContent = `${gate.label}: ${statusLabel}`;
                    prProgress.appendChild(item);
                }
            }

            // Stream message router: maps each SSE method to its handler,
            // adapting the shared (payload, parsed, order) arguments to each
            // handler's own signature. An unknown method has no entry and is
            // ignored, matching the previous switch (which had no default).
            const STREAM_HANDLERS = {
                "item/started": (payload, parsed, order) => handleItemStarted(payload, parsed),
                "item/agentMessage/delta": (payload, parsed, order) => handleAgentDelta(payload),
                "item/plan/delta": (payload, parsed, order) => handlePlanDelta(payload, parsed),
                "item/reasoning/summaryTextDelta": (payload, parsed, order) => {
                    handleReasoningDelta(payload, "reasoningSummary", "summaryIndex");
                },
                "item/reasoning/textDelta": (payload, parsed, order) => {
                    handleReasoningDelta(payload, "reasoningContent", "contentIndex");
                },
                "item/completed": (payload, parsed, order) => handleItemCompleted(payload, parsed),
                "thread/goal/updated": (payload, parsed, order) => handleGoalUpdated(payload, order),
                "thread/goal/cleared": (payload, parsed, order) => handleGoalCleared(order),
                "turn/plan/updated": (payload, parsed, order) => handlePlanUpdated(payload, order),
                "approval/requested": (payload, parsed, order) => handleApprovalRequested(payload),
                "approval/resolved": (payload, parsed, order) => handleApprovalResolved(payload),
                "input/requested": (payload, parsed, order) => handleInputRequested(payload),
                "input/resolved": (payload, parsed, order) => handleInputResolved(payload),
            };

            function handleMessage(event) {
                bump();
                streamFallbackOrder += 1;
                let parsed;
                try { parsed = JSON.parse(event.data); } catch { return; }
                const key = eventKey(parsed);
                if (key) {
                    if (seenEvents.has(key)) return;
                    seenEvents.add(key);
                }
                const payload = parsed.payload || {};
                const order = eventOrder(parsed, streamFallbackOrder);
                // Look up by own property only: method strings come straight
                // off the wire, so an inherited name like "constructor" or
                // "__proto__" must not resolve to an Object.prototype member.
                const handler = Object.prototype.hasOwnProperty.call(STREAM_HANDLERS, parsed.method)
                    ? STREAM_HANDLERS[parsed.method]
                    : null;
                if (handler) handler(payload, parsed, order);
            }

            function handleEnd() {
                streamEnded = true;
                clearRetryTimer();
                if (source) source.close();
                // Reload so the rollout-based render replaces the live DOM
                // (markdown rendering, intermediate collapsing, etc.) and the
                // page picks up any newly-spawned worker.
                window.location.reload();
            }

            function handleReconnect(event) {
                bump();
                if (source) source.close();
                let delay = 5000;
                try {
                    const requested = Number(JSON.parse(event.data).afterMs);
                    if (Number.isFinite(requested) && requested >= 1000) delay = requested;
                } catch {}
                clearRetryTimer();
                retryTimer = window.setTimeout(() => {
                    retryTimer = 0;
                    connect();
                }, delay);
            }

            function connect() {
                if (streamEnded) return;
                if (source) source.close();
                source = new EventSource(streamUrl);
                source.addEventListener("heartbeat", handleHeartbeat);
                source.addEventListener("message", handleMessage);
                source.addEventListener("end", handleEnd);
                source.addEventListener("reconnect", handleReconnect);
                source.addEventListener("error", markConnectionProblem);
            }

            connect();
        })();
    </script>
