    <script>
        (function () {
            const dateTime = new Intl.DateTimeFormat(undefined, {
                year: "numeric",
                month: "short",
                day: "numeric",
                hour: "numeric",
                minute: "2-digit",
                second: "2-digit",
                timeZoneName: "short",
            });
            function formatTimestampElement(el) {
                const seconds = Number(el.dataset.ts);
                if (!Number.isFinite(seconds) || seconds <= 0) return;
                const date = new Date(seconds * 1000);
                el.dateTime = date.toISOString();
                el.title = date.toString();
                el.textContent = dateTime.format(date);
            }
            function formatTimestamps(root) {
                for (const el of root.querySelectorAll("time[data-ts]")) formatTimestampElement(el);
            }
            formatTimestamps(document);
            document.addEventListener("click", (event) => {
                if (!(event.target instanceof Element)) return;
                const command = event.target.closest("[data-expandable-command]");
                if (!command) return;
                const expanded = command.getAttribute("aria-expanded") !== "true";
                command.setAttribute("aria-expanded", expanded ? "true" : "false");
                command.title = expanded ? "Collapse command" : "Expand command";
            });
            function timestampElement(seconds, className) {
                const el = document.createElement("time");
                if (className) el.className = className;
                el.dataset.ts = String(seconds);
                el.textContent = String(seconds);
                formatTimestampElement(el);
                return el;
            }
            window.__hitchTimestampElement = timestampElement;

            async function loadIntermediateDetails(details) {
                if (!details || details.dataset.loaded === "true" || details.dataset.loading === "true") return;
                const url = details.dataset.bodyUrl;
                const body = details.querySelector("[data-intermediate-body]");
                if (!url || !body) return;
                details.dataset.loading = "true";
                body.hidden = false;
                body.setAttribute("aria-busy", "true");
                try {
                    const response = await fetch(url, {
                        headers: { "X-Requested-With": "XMLHttpRequest" },
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    body.innerHTML = await response.text();
                    formatTimestamps(body);
                    const latest = details.parentElement
                        ? details.parentElement.querySelector("[data-intermediate-latest]")
                        : null;
                    const loadedItems = body.querySelectorAll(":scope > .entry");
                    const latestItem = loadedItems[loadedItems.length - 1];
                    if (latest && latestItem) latest.replaceChildren(latestItem);
                    details.dataset.loaded = "true";
                } catch (_error) {
                    body.textContent = "Unable to load details.";
                } finally {
                    delete details.dataset.loading;
                    body.removeAttribute("aria-busy");
                }
            }
            for (const details of document.querySelectorAll("[data-lazy-intermediate]")) {
                details.addEventListener("toggle", () => {
                    if (details.open) loadIntermediateDetails(details);
                });
                if (details.open) loadIntermediateDetails(details);
            }

            function showDialog(dialog) {
                if (!dialog) return;
                if (typeof dialog.showModal === "function") {
                    dialog.showModal();
                } else {
                    dialog.setAttribute("open", "");
                }
            }
            function hideDialog(dialog) {
                if (!dialog) return;
                if (typeof dialog.close === "function") {
                    dialog.close();
                } else {
                    dialog.removeAttribute("open");
                }
            }

            {% include "_primary_nav_script.html" %}

            // Session actions menu and inline rename form.
            const editPanel = document.querySelector("[data-edit-title]");
            const editButton = document.querySelector("[data-edit-title-open]");
            const moveProjectButton = document.querySelector("[data-move-project-open]");
            const moveProjectDialog = document.querySelector("[data-move-project-dialog]");
            const moveProjectCancel = document.querySelector("[data-move-project-cancel]");
            const approvalModeButton = document.querySelector("[data-approval-mode-open]");
            const approvalModeDialog = document.querySelector("[data-approval-mode-dialog]");
            const approvalModeCancel = document.querySelector("[data-approval-mode-cancel]");
            const menu = document.querySelector("[data-session-menu]");
            const menuButton = document.querySelector("[data-session-menu-open]");
            const menuPanel = document.querySelector("[data-session-menu-panel]");
            const closeMenu = () => {
                if (!menuButton || !menuPanel) return;
                menuPanel.hidden = true;
                menuButton.setAttribute("aria-expanded", "false");
            };
            if (menu && menuButton && menuPanel) {
                menuButton.addEventListener("click", () => {
                    const willOpen = menuPanel.hidden;
                    menuPanel.hidden = !willOpen;
                    menuButton.setAttribute("aria-expanded", willOpen ? "true" : "false");
                });
                document.addEventListener("click", (event) => {
                    if (!menu.contains(event.target)) closeMenu();
                });
                document.addEventListener("keydown", (event) => {
                    if (event.key !== "Escape") return;
                    if (menuPanel.hidden) return;
                    closeMenu();
                    menuButton.focus();
                });
            }
            if (editPanel && editButton) {
                editButton.addEventListener("click", () => {
                    closeMenu();
                    editPanel.hidden = false;
                    const input = editPanel.querySelector("input[name='name']");
                    if (input) {
                        input.focus();
                        input.select();
                    }
                    editPanel.scrollIntoView({ behavior: "smooth", block: "center" });
                });
            }
            if (moveProjectButton && moveProjectDialog) {
                moveProjectButton.addEventListener("click", () => {
                    closeMenu();
                    showDialog(moveProjectDialog);
                    const select = moveProjectDialog.querySelector("select[name='project']");
                    if (select) select.focus();
                });
            }
            if (moveProjectCancel && moveProjectDialog) {
                moveProjectCancel.addEventListener("click", () => hideDialog(moveProjectDialog));
            }
            if (approvalModeButton && approvalModeDialog) {
                approvalModeButton.addEventListener("click", () => {
                    closeMenu();
                    showDialog(approvalModeDialog);
                    const select = approvalModeDialog.querySelector("select[name='approval_mode']");
                    if (select) select.focus();
                });
            }
            if (approvalModeCancel && approvalModeDialog) {
                approvalModeCancel.addEventListener("click", () => hideDialog(approvalModeDialog));
            }

            const diffModal = document.querySelector("[data-diff-modal]");
            const diffOpeners = document.querySelectorAll("[data-diff-open]");
            const diffClose = document.querySelector("[data-diff-close]");
            const openDiff = () => {
                if (!diffModal) return;
                if (diffModal.open) return;
                closeMenu();
                if (typeof diffModal.showModal === "function") {
                    diffModal.showModal();
                } else {
                    diffModal.setAttribute("open", "");
                }
            };
            const closeDiff = () => {
                if (!diffModal) return;
                if (typeof diffModal.close === "function") {
                    diffModal.close();
                } else {
                    diffModal.removeAttribute("open");
                }
            };
            for (const opener of diffOpeners) {
                opener.addEventListener("click", () => {
                    if (opener.disabled) return;
                    openDiff();
                });
            }
            if (diffClose) diffClose.addEventListener("click", closeDiff);
            if (diffModal) {
                diffModal.addEventListener("click", (event) => {
                    if (event.target === diffModal) closeDiff();
                });
            }

            const LONG_PRESS_MS = 650;
            const LONG_PRESS_MOVE_PX = 10;
            // How long the "copied" flash stays on, and how long the click that
            // follows a long-press/copy is suppressed; kept in sync with the
            // .copied CSS transition.
            const COPY_FEEDBACK_MS = 900;
            let longPress = null;
            let suppressMessageClickUntil = 0;

            function copyableMessageFrom(target) {
                if (!(target instanceof Element)) return null;
                return target.closest("[data-copyable-message]");
            }

            function messageCopyText(message) {
                const body = message.querySelector(".body");
                if (!body) return "";
                return (body.innerText || body.textContent || "").trimEnd();
            }

            const copyText = window.hitch.copyToClipboard;

            function markCopied(message) {
                message.classList.add("copied");
                window.setTimeout(() => message.classList.remove("copied"), COPY_FEEDBACK_MS);
            }

            function copyMessage(message) {
                suppressMessageClickUntil = Date.now() + COPY_FEEDBACK_MS;
                copyText(messageCopyText(message)).then((copied) => {
                    if (copied) markCopied(message);
                }).catch(() => {});
            }

            function clearLongPress() {
                if (!longPress) return;
                window.clearTimeout(longPress.timer);
                longPress = null;
            }

            document.addEventListener("pointerdown", (event) => {
                if (event.button && event.button !== 0) return;
                const message = copyableMessageFrom(event.target);
                if (!message) return;
                clearLongPress();
                longPress = {
                    pointerId: event.pointerId,
                    message,
                    startX: event.clientX,
                    startY: event.clientY,
                    timer: window.setTimeout(() => {
                        const pendingMessage = longPress ? longPress.message : message;
                        longPress = null;
                        copyMessage(pendingMessage);
                    }, LONG_PRESS_MS),
                };
            });
            document.addEventListener("pointermove", (event) => {
                if (!longPress || event.pointerId !== longPress.pointerId) return;
                const dx = Math.abs(event.clientX - longPress.startX);
                const dy = Math.abs(event.clientY - longPress.startY);
                if (dx > LONG_PRESS_MOVE_PX || dy > LONG_PRESS_MOVE_PX) clearLongPress();
            }, { passive: true });
            document.addEventListener("pointerup", clearLongPress);
            document.addEventListener("pointercancel", clearLongPress);
            document.addEventListener("contextmenu", (event) => {
                const message = copyableMessageFrom(event.target);
                if (!message) return;
                if (!longPress && Date.now() > suppressMessageClickUntil) return;
                event.preventDefault();
                if (!longPress) return;
                const pendingMessage = longPress.message;
                clearLongPress();
                copyMessage(pendingMessage);
            });
            document.addEventListener("click", (event) => {
                if (Date.now() > suppressMessageClickUntil) return;
                if (!copyableMessageFrom(event.target)) return;
                event.preventDefault();
                event.stopPropagation();
            }, true);

            function isSuperEnter(event) {
                const hasSuper = event.metaKey
                    || (event.getModifierState && event.getModifierState("Meta"))
                    || (event.getModifierState && event.getModifierState("OS"));
                return event.key === "Enter" && hasSuper;
            }
            function requestSubmit(form, submitter) {
                if (!form || !submitter || submitter.disabled) return;
                if (typeof form.requestSubmit === "function") {
                    form.requestSubmit(submitter);
                } else {
                    submitter.click();
                }
            }
            const stopForm = document.querySelector("[data-stop-form]");
            let stopSubmitting = false;
            if (stopForm) {
                stopForm.addEventListener("submit", (event) => {
                    if (stopSubmitting) {
                        event.preventDefault();
                        return;
                    }
                    stopSubmitting = true;
                    for (const button of document.querySelectorAll("[data-composer-stop]")) {
                        button.disabled = true;
                    }
                });
            }

            // Composer: auto-grow the textarea up to its CSS max-height and
            // disable submit when empty. Enter inserts a newline; Super+Enter
            // submits the send button.
            const composer = document.querySelector("[data-composer]");
            if (composer) {
                const input = composer.querySelector("[data-composer-input]");
                const submit = composer.querySelector("[data-composer-submit]");
                const stop = composer.querySelector("[data-composer-stop]");
                const planModeInput = composer.querySelector("[data-plan-mode-input]");
                const planModeExplicitInput = composer.querySelector("[data-plan-mode-explicit-input]");
                const slashCommand = composer.querySelector("[data-slash-command]");
                const slashTrigger = composer.querySelector("[data-slash-trigger]");
                const slashMenu = composer.querySelector("[data-slash-menu]");
                const slashPlan = composer.querySelector("[data-slash-plan]");
                const slashPr = composer.querySelector("[data-slash-pr]");
                const slashPrNow = composer.querySelector("[data-slash-pr-now]");
                const slashFixPr = composer.querySelector("[data-slash-fix-pr]");
                const slashQa = composer.querySelector("[data-slash-qa]");
                const imageButton = composer.querySelector("[data-image-button]");
                const imageInput = composer.querySelector("[data-image-input]");
                const imageSummary = composer.querySelector("[data-image-summary]");
                const imageClear = composer.querySelector("[data-image-clear]");
                const liveWork = document.querySelector("[data-live-work]");
                const nextMessageConfig = document.querySelector("[data-next-message-config]");
                const nextMessageItems = nextMessageConfig
                    ? nextMessageConfig.querySelectorAll("[data-next-message-item]")
                    : [];
                const composerHeightProperty = "--composer-height";
                const composerKeyboardOffsetProperty = "--composer-keyboard-offset";
                const mobileComposerQuery = window.matchMedia("(max-width: 640px)");
                // Re-measure the keyboard offset at a few delays so the composer
                // settles correctly as the mobile virtual keyboard animates in.
                const composerKeyboardSettleDelays = [50, 150, 300, 500];
                const prPrompt = "{{ pr_slash_prompt|escapejs }}";
                const prNowCommand = "/pr-now";
                const fixPrPrompt = "{{ fix_pr_slash_command|escapejs }}";
                const qaPrompt = "{{ qa_slash_prompt|escapejs }}";
                const workflowLocked = composer.dataset.workflowLocked === "true";
                let composerKeyboardFrame = 0;
                let composerKeyboardSettleTimers = [];
                const hasImages = () => imageInput && (imageInput.files || []).length > 0;
                const syncComposerHeight = () => {
                    const height = Math.ceil(composer.getBoundingClientRect().height);
                    if (height > 0) {
                        document.documentElement.style.setProperty(composerHeightProperty, `${height}px`);
                    }
                };
                const sync = () => {
                    input.style.height = "auto";
                    input.style.height = input.scrollHeight + "px";
                    syncComposerHeight();
                    submit.disabled = workflowLocked || (
                        input.value.trim().length === 0 && !hasImages()
                    );
                };
                const syncImageSummary = () => {
                    if (!imageInput) return;
                    const files = Array.from(imageInput.files || []);
                    if (!files.length) {
                        if (imageButton) {
                            delete imageButton.dataset.hasImages;
                            delete imageButton.dataset.count;
                        }
                        if (imageSummary) {
                            imageSummary.hidden = true;
                            imageSummary.textContent = "";
                        }
                        if (imageClear) imageClear.hidden = true;
                        return;
                    }
                    if (imageButton) {
                        imageButton.dataset.hasImages = "true";
                        imageButton.dataset.count = String(files.length);
                    }
                    if (imageSummary) {
                        imageSummary.hidden = false;
                        imageSummary.textContent = files.length === 1
                            ? files[0].name
                            : `${files.length} images`;
                    }
                    if (imageClear) imageClear.hidden = false;
                };
                const clearImages = () => {
                    if (!imageInput) return;
                    imageInput.value = "";
                    syncImageSummary();
                    sync();
                };
                const clearComposerKeyboardOffset = () => {
                    document.documentElement.style.removeProperty(composerKeyboardOffsetProperty);
                };
                const clearComposerKeyboardSettleTimers = () => {
                    for (const timer of composerKeyboardSettleTimers) {
                        window.clearTimeout(timer);
                    }
                    composerKeyboardSettleTimers = [];
                };
                const updateComposerKeyboardOffset = () => {
                    composerKeyboardFrame = 0;
                    const viewport = window.visualViewport;
                    if (
                        !viewport
                        || !mobileComposerQuery.matches
                        || Math.abs((viewport.scale || 1) - 1) > 0.01
                        || !composer.contains(document.activeElement)
                    ) {
                        clearComposerKeyboardOffset();
                        return;
                    }
                    const layoutHeight = Math.max(
                        document.documentElement.clientHeight || 0,
                        window.innerHeight || 0,
                    );
                    const offset = Math.max(
                        0,
                        Math.ceil(layoutHeight - viewport.height - viewport.offsetTop),
                    );
                    if (offset > 0) {
                        document.documentElement.style.setProperty(
                            composerKeyboardOffsetProperty,
                            `${offset}px`,
                        );
                    } else {
                        clearComposerKeyboardOffset();
                    }
                };
                const scheduleComposerKeyboardOffset = () => {
                    if (composerKeyboardFrame) return;
                    composerKeyboardFrame = window.requestAnimationFrame(updateComposerKeyboardOffset);
                };
                const scheduleSettledComposerKeyboardOffset = () => {
                    scheduleComposerKeyboardOffset();
                    clearComposerKeyboardSettleTimers();
                    if (!composer.contains(document.activeElement)) return;
                    composerKeyboardSettleTimers = composerKeyboardSettleDelays.map(
                        (delay) => window.setTimeout(scheduleComposerKeyboardOffset, delay),
                    );
                };
                const parsePlanCommand = () => {
                    const text = input.value.trim();
                    const parts = text.split(/\s+/, 2);
                    if ((parts[0] || "").toLowerCase() !== "/plan") return null;
                    return text.slice(parts[0].length).trim();
                };
                const parsePrCommand = () => {
                    const text = input.value.trim();
                    const parts = text.split(/\s+/, 2);
                    if ((parts[0] || "").toLowerCase() !== "/pr") return null;
                    return prPrompt;
                };
                const parsePrNowCommand = () => {
                    const text = input.value.trim();
                    const parts = text.split(/\s+/, 2);
                    if ((parts[0] || "").toLowerCase() !== prNowCommand) return null;
                    return prNowCommand;
                };
                const parseFixPrCommand = () => {
                    const text = input.value.trim();
                    const parts = text.split(/\s+/, 2);
                    if ((parts[0] || "").toLowerCase() !== fixPrPrompt) return null;
                    return fixPrPrompt;
                };
                const parseQaCommand = () => {
                    const text = input.value.trim();
                    const parts = text.split(/\s+/, 2);
                    if ((parts[0] || "").toLowerCase() !== "/qa") return null;
                    return qaPrompt;
                };
                const syncNextMessageConfig = () => {
                    const workflowCommand = parsePrCommand() !== null
                        || parsePrNowCommand() !== null
                        || parseFixPrCommand() !== null
                        || parseQaCommand() !== null;
                    const planMode = !workflowCommand && (
                        composer.dataset.planMode === "true"
                        || parsePlanCommand() !== null
                    );
                    if (nextMessageConfig) {
                        nextMessageConfig.dataset.planMode = planMode ? "true" : "false";
                    }
                    for (const item of nextMessageItems) {
                        const value = item.querySelector("[data-next-message-value]");
                        if (!value) continue;
                        value.textContent = planMode
                            ? item.dataset.planValue || item.dataset.normalValue || ""
                            : item.dataset.normalValue || "";
                    }
                };
                const setPlanMode = (enabled, explicit = false) => {
                    composer.dataset.planMode = enabled ? "true" : "false";
                    if (planModeInput) planModeInput.value = enabled ? "true" : "";
                    if (planModeExplicitInput) {
                        planModeExplicitInput.value = explicit ? "true" : "";
                    }
                    if (slashTrigger) slashTrigger.setAttribute("aria-pressed", enabled ? "true" : "false");
                    if (slashPlan) slashPlan.setAttribute("aria-checked", enabled ? "true" : "false");
                    syncNextMessageConfig();
                };
                const syncSlashMenuStatusOffset = () => {
                    if (!liveWork || !slashMenu) return;
                    if (slashMenu.hidden) {
                        delete liveWork.dataset.slashMenuOpen;
                    } else {
                        liveWork.dataset.slashMenuOpen = "true";
                    }
                };
                const closeSlashMenu = () => {
                    if (!slashMenu || !slashTrigger) return;
                    slashMenu.hidden = true;
                    slashTrigger.setAttribute("aria-expanded", "false");
                    syncSlashMenuStatusOffset();
                };
                const openSlashMenu = () => {
                    if (!slashMenu || !slashTrigger) return;
                    slashMenu.hidden = false;
                    slashTrigger.setAttribute("aria-expanded", "true");
                    syncSlashMenuStatusOffset();
                };
                setPlanMode(composer.dataset.initialPlanMode === "true");
                sync();
                syncImageSummary();
                const composerResizeObserver = "ResizeObserver" in window
                    ? new ResizeObserver(syncComposerHeight)
                    : null;
                if (composerResizeObserver) composerResizeObserver.observe(composer);
                if (imageInput) {
                    imageInput.addEventListener("change", () => {
                        syncImageSummary();
                        sync();
                    });
                }
                if (imageClear) imageClear.addEventListener("click", clearImages);
                if (slashTrigger && slashMenu) {
                    slashTrigger.addEventListener("click", () => {
                        if (slashMenu.hidden) {
                            openSlashMenu();
                        } else {
                            closeSlashMenu();
                        }
                    });
                }
                if (slashPlan) {
                    slashPlan.addEventListener("click", () => {
                        const enabled = composer.dataset.planMode !== "true";
                        setPlanMode(enabled, true);
                        if (enabled && input.value.trim() === "/") {
                            input.value = "";
                            sync();
                        }
                        closeSlashMenu();
                        input.focus();
                    });
                }
                if (slashPr) {
                    slashPr.addEventListener("click", () => {
                        setPlanMode(false, true);
                        clearImages();
                        input.value = prPrompt;
                        sync();
                        closeSlashMenu();
                        requestSubmit(composer, submit);
                    });
                }
                if (slashPrNow) {
                    slashPrNow.addEventListener("click", () => {
                        setPlanMode(false, true);
                        clearImages();
                        input.value = prNowCommand;
                        sync();
                        closeSlashMenu();
                        requestSubmit(composer, submit);
                    });
                }
                if (slashFixPr) {
                    slashFixPr.addEventListener("click", () => {
                        setPlanMode(false, true);
                        clearImages();
                        input.value = fixPrPrompt;
                        sync();
                        closeSlashMenu();
                        requestSubmit(composer, submit);
                    });
                }
                if (slashQa) {
                    slashQa.addEventListener("click", () => {
                        setPlanMode(false, true);
                        clearImages();
                        input.value = qaPrompt;
                        sync();
                        closeSlashMenu();
                        requestSubmit(composer, submit);
                    });
                }
                document.addEventListener("click", (event) => {
                    if (!slashCommand || !slashMenu || slashMenu.hidden) return;
                    if (!slashCommand.contains(event.target)) closeSlashMenu();
                });
                document.addEventListener("keydown", (event) => {
                    if (event.key !== "Escape") return;
                    if (!slashMenu || slashMenu.hidden) return;
                    closeSlashMenu();
                    if (slashTrigger) slashTrigger.focus();
                });
                input.addEventListener("input", () => {
                    sync();
                    if (input.value.trim() === "/") {
                        openSlashMenu();
                    } else {
                        closeSlashMenu();
                    }
                    syncNextMessageConfig();
                });
                input.addEventListener("keydown", (event) => {
                    if (!isSuperEnter(event)) return;
                    event.preventDefault();
                    requestSubmit(composer, submit);
                });
                composer.addEventListener("focusin", scheduleSettledComposerKeyboardOffset);
                composer.addEventListener("focusout", () => {
                    clearComposerKeyboardSettleTimers();
                    window.setTimeout(scheduleComposerKeyboardOffset, 0);
                });
                if (window.visualViewport) {
                    window.visualViewport.addEventListener("resize", scheduleSettledComposerKeyboardOffset);
                    window.visualViewport.addEventListener("scroll", scheduleSettledComposerKeyboardOffset);
                }
                window.addEventListener("resize", () => {
                    syncComposerHeight();
                    scheduleSettledComposerKeyboardOffset();
                });
                composer.addEventListener("submit", (event) => {
                    const submitter = event.submitter || document.activeElement;
                    if (workflowLocked && submitter !== stop) {
                        event.preventDefault();
                        return;
                    }
                    const isStopSubmit = submitter === stop;
                    if (isStopSubmit) {
                        clearImages();
                    } else {
                        const prCommandPrompt = parsePrCommand();
                        const prNowCommandPrompt = prCommandPrompt === null ? parsePrNowCommand() : null;
                        const fixPrCommandPrompt = (
                            prCommandPrompt === null && prNowCommandPrompt === null
                        ) ? parseFixPrCommand() : null;
                        const qaCommandPrompt = (
                            prCommandPrompt === null
                            && prNowCommandPrompt === null
                            && fixPrCommandPrompt === null
                        ) ? parseQaCommand() : null;
                        const workflowCommandPrompt = prCommandPrompt
                            || prNowCommandPrompt
                            || fixPrCommandPrompt
                            || qaCommandPrompt;
                        const commandPrompt = workflowCommandPrompt === null ? parsePlanCommand() : null;
                        if (workflowCommandPrompt !== null) {
                            setPlanMode(false, true);
                            clearImages();
                            input.value = workflowCommandPrompt;
                            sync();
                        } else if (commandPrompt !== null) {
                            setPlanMode(true, true);
                            input.value = commandPrompt;
                            if (!commandPrompt && !hasImages()) {
                                event.preventDefault();
                                sync();
                                input.focus();
                                return;
                            }
                            sync();
                        }
                    }
                    // Defer the disable until after the form's entry
                    // list has been serialized: the Stop button carries
                    // the active worker's id as its name/value, and
                    // disabling the submitter inside the submit handler
                    // can strip that pair from the POST in browsers
                    // that apply the disabled-state before serialization
                    // — which would silently drop the instance id and
                    // let `stop_session` fall back to "latest active",
                    // potentially aborting the wrong overlapping worker.
                    setTimeout(() => {
                        submit.disabled = true;
                        if (stop) stop.disabled = true;
                    }, 0);
                });
            }
        })();
    </script>

    <script>
        // Subscribe to the session SSE feed.
        //
        // The live work strip (fixed above the composer) shows the live
        // stream's state: pulsing green "Codex is working…" while a turn is
        // in progress, hidden when connected and idle, amber "Reconnecting…"
        // for recoverable transport loss, and red "Connection lost" only
        // after a longer fatal timeout. Goal notifications update the adjacent
        // chip with Codex's current high-level objective. The server emits
        // a named ``heartbeat`` event every few seconds carrying
        // ``{working: bool}`` so the pill can stay accurate without
        // inferring state from item events alone.
        //
        // When a live worker is rendering we also progressively project
        // its item events into the DOM (agent deltas, tool-call status);
        // when the stream ends we reload so the canonical rollout-based
        // render replaces the scratch UI in one step.
        (function () {
            const streamSource = document.querySelector("[data-stream-url]");
            const indicator = document.querySelector("[data-live-status]");
            const liveWork = document.querySelector("[data-live-work]");
            const liveGoal = document.querySelector("[data-live-goal]");
            const liveGoalText = document.querySelector("[data-live-goal-text]");
            const prProgress = document.querySelector("[data-pr-progress]");
            const streamUrl = streamSource && streamSource.dataset.streamUrl;
            if (!streamUrl || !indicator) return;

            function timestampElement(seconds, className) {
                if (typeof window.__hitchTimestampElement === "function") {
                    return window.__hitchTimestampElement(seconds, className);
                }
                const el = document.createElement("time");
                if (className) el.className = className;
                el.dataset.ts = String(seconds);
                el.textContent = String(seconds);
                const date = new Date(seconds * 1000);
                if (Number.isFinite(date.getTime())) {
                    el.dateTime = date.toISOString();
                    el.title = date.toString();
                    el.textContent = date.toLocaleString(undefined, {
                        year: "numeric",
                        month: "short",
                        day: "numeric",
                        hour: "numeric",
                        minute: "2-digit",
                        second: "2-digit",
                        timeZoneName: "short",
                    });
                }
                return el;
            }

            function timestampSecondsForEvent(event) {
                const recordedAt = Number(event && event.recordedAt);
                if (Number.isFinite(recordedAt) && recordedAt > 0) {
                    return recordedAt / 1000000;
                }
                return Date.now() / 1000;
            }

            const STATE_TEXT = {
                disconnected: "Connection lost",
                idle: "Connected",
                reconnecting: "Reconnecting…",
                working: "Codex is working…",
            };
            let workingText = indicator.dataset.workingText || STATE_TEXT.working;
            // Liveness budget: heartbeats arrive ~3s apart, so two missed
            // intervals plus a margin move the pill into reconnecting.
            // Only show "Connection lost" after a substantially longer
            // period with no successful frame.
            const STALE_MS = 8000;
            const RECONNECT_FATAL_MS = 30000;
            const RETRY_MS = 2000;
            // Initial state matches what the server rendered so the pill
            // doesn't flash through "disconnected" before the first
            // heartbeat arrives.
            let connState = indicator.dataset.state || "disconnected";
            let lastFrame = Date.now();
            let problemStartedAt = 0;
            let retryTimer = 0;
            let source = null;
            let streamEnded = false;
            function statusTextFor(state) {
                return state === "working" ? workingText : STATE_TEXT[state];
            }
            function setState(state) {
                const retryable = state === "reconnecting" || state === "disconnected";
                indicator.setAttribute("role", retryable ? "button" : "status");
                if (retryable) {
                    indicator.tabIndex = 0;
                } else {
                    indicator.removeAttribute("tabindex");
                }
                const nextText = statusTextFor(state);
                if (state !== connState) {
                    connState = state;
                    indicator.dataset.state = state;
                    if (liveWork) liveWork.dataset.state = state;
                }
                if (indicator.textContent !== nextText) indicator.textContent = nextText;
            }
            function clearRetryTimer() {
                if (!retryTimer) return;
                clearTimeout(retryTimer);
                retryTimer = 0;
            }
            function bump() {
                lastFrame = Date.now();
                problemStartedAt = 0;
                clearRetryTimer();
                // A frame arrived, so the transport is healthy. Heartbeats set
                // the precise working/idle state; for plain data frames during a
                // recovery, clear the stale "reconnecting"/"disconnected" pill
                // optimistically rather than leave it lying until the next
                // heartbeat lands.
                if (connState === "reconnecting" || connState === "disconnected") {
                    setState("working");
                }
            }
            function retryNow() {
                if (streamEnded) return;
                clearRetryTimer();
                problemStartedAt = Date.now();
                lastFrame = Date.now();
                setState("reconnecting");
                connect();
            }
            function scheduleRetry() {
                if (streamEnded || retryTimer) return;
                retryTimer = window.setTimeout(() => {
                    retryTimer = 0;
                    connect();
                }, RETRY_MS);
            }
            function markConnectionProblem() {
                if (!problemStartedAt) problemStartedAt = Date.now();
                const failedFor = Date.now() - problemStartedAt;
                setState(failedFor >= RECONNECT_FATAL_MS ? "disconnected" : "reconnecting");
                scheduleRetry();
            }
            indicator.addEventListener("click", () => {
                if (connState === "reconnecting" || connState === "disconnected") retryNow();
            });
            indicator.addEventListener("keydown", (event) => {
                if (event.key !== "Enter" && event.key !== " ") return;
                if (connState !== "reconnecting" && connState !== "disconnected") return;
                event.preventDefault();
                retryNow();
            });
            // Periodically re-check liveness so a silent connection (no
            // heartbeats arriving despite the EventSource still believing
            // it's open) starts a manual reconnect. A fatal label appears
            // only after repeated reconnect attempts fail to produce frames.
            setInterval(() => {
                if (!streamEnded && Date.now() - lastFrame > STALE_MS) markConnectionProblem();
            }, 1000);

            const sessionMain = document.querySelector("[data-session-main]");
            const liveRoot = document.querySelector("[data-live-root]");
            const historyStartRequested = window.location.hash === "#history-start";
            const historyPartial = sessionMain && sessionMain.dataset.historyPartial === "true";
            const READ_ONLY = liveRoot && liveRoot.dataset.readOnly === "true";
            const HIDE_LIVE_TRANSCRIPT = liveRoot && liveRoot.dataset.hideTranscript === "true";
            const HIDE_LIVE_USER_MESSAGE = liveRoot && liveRoot.dataset.hideUserMessage === "true";
            const SANITIZE_LIVE_DETAILS = liveRoot && liveRoot.dataset.sanitizeLiveDetails === "true";
            // The Django ``resolve_approval`` URL is templated with a
            // placeholder pk of ``0`` server-side; the JS swaps in the
            // real ApprovalRequest id when a decision is posted.
            const APPROVAL_URL_TEMPLATE = liveRoot
                ? liveRoot.dataset.approvalUrlTemplate || ""
                : "";
            const INPUT_URL_TEMPLATE = liveRoot
                ? liveRoot.dataset.inputUrlTemplate || ""
                : "";
            const empty = document.querySelector(".empty-thread");
            const jumpLatest = document.querySelector("[data-jump-latest]");
            const historyLoader = document.querySelector("[data-history-loader]");
            const historyAll = document.querySelector("[data-history-all]");
            const scrollRoot = document.scrollingElement || document.documentElement;
            const FOLLOW_MARGIN = 96;
            let followLatest = !!liveRoot && !historyStartRequested;
            let lastScrollY = window.scrollY;
            let followFrame = 0;

            function distanceFromBottom() {
                return scrollRoot.scrollHeight - window.innerHeight - window.scrollY;
            }

            function nearBottom() {
                return distanceFromBottom() <= FOLLOW_MARGIN;
            }

            function syncJumpButton() {
                if (!jumpLatest) return;
                jumpLatest.hidden = followLatest;
            }

            function scrollToLatest(smooth) {
                window.scrollTo({
                    top: scrollRoot.scrollHeight,
                    behavior: smooth ? "smooth" : "auto",
                });
                syncJumpButton();
            }

            function followRenderedContent() {
                if (!followLatest || !liveRoot) {
                    syncJumpButton();
                    return;
                }
                if (followFrame) cancelAnimationFrame(followFrame);
                followFrame = requestAnimationFrame(() => {
                    followFrame = 0;
                    if (followLatest) {
                        scrollToLatest(false);
                    } else {
                        syncJumpButton();
                    }
                });
            }

            if (liveRoot && !historyStartRequested) {
                requestAnimationFrame(() => scrollToLatest(false));
            }
            window.addEventListener("scroll", () => {
                const currentY = window.scrollY;
                if (currentY < lastScrollY - 4) {
                    followLatest = false;
                } else if (nearBottom()) {
                    followLatest = true;
                }
                lastScrollY = currentY;
                syncJumpButton();
            }, { passive: true });
            if (jumpLatest) {
                jumpLatest.addEventListener("click", () => {
                    followLatest = true;
                    scrollToLatest(true);
                });
            }
            if (historyAll) {
                historyAll.addEventListener("click", () => {
                    const url = new URL(window.location.href);
                    url.searchParams.set("history", "all");
                    url.hash = "history-start";
                    window.location.assign(url);
                });
            }
            if (historyLoader) {
                let historyLoading = false;
                const loadEarlierHistory = async (emptyPageBudget = 1) => {
                    if (historyLoading || !historyLoader.dataset.nextUrl) return;
                    historyLoading = true;
                    historyLoader.disabled = true;
                    const oldHeight = scrollRoot.scrollHeight;
                    const oldY = window.scrollY;
                    try {
                        const response = await fetch(historyLoader.dataset.nextUrl, {
                            headers: { "X-Requested-With": "XMLHttpRequest" },
                        });
                        if (!response.ok) throw new Error(`history request failed: ${response.status}`);
                        const documentFragment = document.createRange().createContextualFragment(
                            await response.text()
                        );
                        const page = documentFragment.querySelector("[data-history-page]");
                        if (!page) throw new Error("history response was invalid");
                        formatTimestamps(page);
                        const nextUrl = page.dataset.nextUrl || "";
                        const entries = document.createDocumentFragment();
                        while (page.firstChild) entries.appendChild(page.firstChild);
                        historyLoader.after(entries);
                        historyLoader.dataset.nextUrl = nextUrl;
                        if (nextUrl) historyLoader.disabled = false;
                        else historyLoader.remove();
                        window.scrollTo(0, oldY + scrollRoot.scrollHeight - oldHeight);
                        if (
                            nextUrl
                            && scrollRoot.scrollHeight === oldHeight
                            && emptyPageBudget > 0
                        ) {
                            historyLoading = false;
                            await loadEarlierHistory(emptyPageBudget - 1);
                            return;
                        }
                    } catch (_error) {
                        historyLoader.textContent = "Retry loading earlier messages";
                        historyLoader.disabled = false;
                    } finally {
                        historyLoading = false;
                    }
                };
                historyLoader.addEventListener("click", () => loadEarlierHistory());
                const historyObserver = new IntersectionObserver((items) => {
                    if (items.some((item) => item.isIntersecting)) loadEarlierHistory();
                });
                requestAnimationFrame(() => {
                    window.scrollTo(0, scrollRoot.scrollHeight);
                    historyObserver.observe(historyLoader);
                });
            } else if (historyPartial) {
                requestAnimationFrame(() => window.scrollTo(0, scrollRoot.scrollHeight));
            }

            // Per-item DOM trackers. Items are keyed by the server-assigned
            // item id; for agent messages we keep a reference to the body
            // node so deltas append directly.
            const items = new Map();
            const planViews = new Map();
            let liveActivityRun = null;
            const taskPlan = document.querySelector("[data-task-plan]");
            const taskPlanToggle = taskPlan && taskPlan.querySelector("[data-task-plan-toggle]");
            const taskPlanCurrent = taskPlan && taskPlan.querySelector("[data-task-plan-current]");
            const taskPlanExplanation = taskPlan && taskPlan.querySelector("[data-task-plan-explanation]");
            const taskPlanList = taskPlan && taskPlan.querySelector("[data-task-plan-list]");
            // The pending-user bubble is replaced once the server-side
            // user message arrives via the stream, so it doesn't end up
            // double-rendered with the canonical reload.
            const pendingUser = document.querySelector("[data-pending-user]");

            const TOOL_LABELS = {
                commandExecution: "Command",
                mcpToolCall: "MCP tool call",
                dynamicToolCall: "Tool call",
                fileChange: "File change",
                webSearch: "Web search",
                collabAgentToolCall: "Collab agent call",
                imageView: "Image view",
                imageGeneration: "Image generation",
                reasoning: "Reasoning",
                plan: "Plan",
                hookPrompt: "Hook prompt",
                enteredReviewMode: "Entered review mode",
                exitedReviewMode: "Exited review mode",
                contextCompaction: "Context compaction",
            };

            // Pending approval prompts. Keyed by ApprovalRequest pk so an
            // ``approval/resolved`` event can find and finalize the matching
            // node without re-rendering the whole turn.
            const approvals = new Map();
            const inputRequests = new Map();
            let latestGoalOrder = [0, 0];
            let streamFallbackOrder = 0;
            let latestTaskPlanOrder = [
                taskPlan ? Number(taskPlan.dataset.recordedAt) || 0 : 0,
                taskPlan ? Number(taskPlan.dataset.eventSeq) || 0 : 0,
                taskPlan ? Number(taskPlan.dataset.fallbackOrder) || 0 : 0,
            ];

            const APPROVAL_LABELS = {
                "item/commandExecution/requestApproval": "Run command?",
                "item/fileChange/requestApproval": "Apply file change?",
            };

            function approvalDetail(method, params) {
                const item = (params && params.item) || params || {};
                if (method === "item/commandExecution/requestApproval") {
                    return item.command || JSON.stringify(item, null, 2);
                }
                if (method === "item/fileChange/requestApproval") {
                    const paths = (item.changes || []).map((c) => c.path).filter(Boolean);
                    if (paths.length) return paths.join("\n");
                }
                return JSON.stringify(item, null, 2);
            }

            function demoCommandDetail(command) {
                return String(command || "").trim() ? "Command details hidden in demo panel." : "";
            }

            function demoFileChangeDetail(changes) {
                const count = (changes || []).filter((c) => c.path).length;
                if (!count) return "";
                return count === 1 ? "1 file" : count + " files";
            }

            function sanitizedApprovalDetail(method, params) {
                const item = (params && params.item) || params || {};
                if (method === "item/commandExecution/requestApproval") {
                    const detail = demoCommandDetail(item.command || "");
                    if (detail) return "Demo setup command approval requested. " + detail;
                    return "Demo setup command approval requested.";
                }
                if (method === "item/fileChange/requestApproval") {
                    const detail = demoFileChangeDetail(item.changes || []);
                    if (detail) return "Demo setup file change approval requested. " + detail;
                    return "Demo setup file change approval requested.";
                }
                return "Demo setup approval requested.";
            }

            function execpolicyAmendmentDecision(params) {
                const decisions = params && Array.isArray(params.availableDecisions)
                    ? params.availableDecisions
                    : [];
                return decisions.find((decision) => {
                    return decision
                        && typeof decision === "object"
                        && decision.acceptWithExecpolicyAmendment
                        && Array.isArray(decision.acceptWithExecpolicyAmendment.execpolicy_amendment);
                }) || null;
            }

            function approvalDecisionText(decision) {
                if (typeof decision === "string") return decision || "decline";
                if (decision && typeof decision === "object" && decision.acceptWithExecpolicyAmendment) {
                    return "accept and remember";
                }
                return "decline";
            }

            function sanitizedToolDetail(item) {
                if (item.type === "commandExecution") {
                    return demoCommandDetail(item.command || "") || "Demo setup command details hidden.";
                }
                if (item.type === "fileChange") {
                    return demoFileChangeDetail(item.changes || []) || "Demo setup file change";
                }
                if (item.type === "reasoning") {
                    return "Reasoning details hidden in demo panel.";
                }
                if (
                    item.type === "mcpToolCall"
                    || item.type === "webSearch"
                    || item.type === "plan"
                    || item.type === "imageView"
                    || item.type === "imageGeneration"
                ) {
                    return rawToolDetail(item);
                }
                return "";
            }

            function ensureNoEmpty() {
                if (empty && empty.parentNode) empty.remove();
            }

            function placeBeforeLive(node) {
                if (!liveRoot || !liveRoot.parentNode) return;
                liveRoot.parentNode.insertBefore(node, liveRoot);
            }

            function insertBeforeLive(node) {
                liveActivityRun = null;
                placeBeforeLive(node);
            }

            function activitySummary(reasoningCount, commandCount, webSearchCount) {
                const parts = [];
                if (reasoningCount) {
                    parts.push(reasoningCount + " reasoning message" + (reasoningCount === 1 ? "" : "s"));
                }
                if (commandCount) {
                    parts.push(commandCount + " command message" + (commandCount === 1 ? "" : "s"));
                }
                if (webSearchCount) {
                    parts.push(webSearchCount + " web search" + (webSearchCount === 1 ? "" : "es"));
                }
                if (parts.length < 3) return parts.join(" and ");
                return parts.slice(0, -1).join(", ") + ", and " + parts[parts.length - 1];
            }

            function activityAction(className, text) {
                const action = document.createElement("span");
                action.className = "intermediate-action " + className;
                action.textContent = text;
                return action;
            }

            function createActivityGroup(run, nextNode, nextType) {
                const group = document.createElement("div");
                group.className = "intermediate-group";
                const details = document.createElement("details");
                details.className = "intermediate";
                const summary = document.createElement("summary");
                const summaryText = document.createElement("span");
                summary.appendChild(summaryText);
                summary.appendChild(activityAction("intermediate-action-expand", "Show all"));
                summary.appendChild(activityAction("intermediate-action-collapse", "Show latest"));
                const body = document.createElement("div");
                body.className = "intermediate-body";
                body.dataset.intermediateBody = "";
                const latest = document.createElement("div");
                latest.className = "intermediate-latest";
                latest.dataset.intermediateLatest = "";
                details.appendChild(summary);
                details.appendChild(body);
                group.appendChild(details);
                group.appendChild(latest);

                run.latestNode.parentNode.insertBefore(group, run.latestNode);
                body.appendChild(run.latestNode);
                latest.appendChild(nextNode);
                run.group = group;
                run.body = body;
                run.latest = latest;
                run.summaryText = summaryText;
                run.latestNode = nextNode;
                if (nextType === "reasoning") run.reasoningCount += 1;
                if (nextType === "commandExecution") run.commandCount += 1;
                if (nextType === "webSearch") run.webSearchCount += 1;
                summaryText.textContent = activitySummary(
                    run.reasoningCount,
                    run.commandCount,
                    run.webSearchCount
                );
            }

            function insertActivityBeforeLive(node, itemType) {
                if (!liveActivityRun) {
                    placeBeforeLive(node);
                    liveActivityRun = {
                        group: null,
                        body: null,
                        latest: null,
                        summaryText: null,
                        latestNode: node,
                        reasoningCount: itemType === "reasoning" ? 1 : 0,
                        commandCount: itemType === "commandExecution" ? 1 : 0,
                        webSearchCount: itemType === "webSearch" ? 1 : 0,
                    };
                    return;
                }
                if (!liveActivityRun.group) {
                    createActivityGroup(liveActivityRun, node, itemType);
                    return;
                }
                liveActivityRun.body.appendChild(liveActivityRun.latestNode);
                liveActivityRun.latest.appendChild(node);
                liveActivityRun.latestNode = node;
                if (itemType === "reasoning") liveActivityRun.reasoningCount += 1;
                if (itemType === "commandExecution") liveActivityRun.commandCount += 1;
                if (itemType === "webSearch") liveActivityRun.webSearchCount += 1;
                liveActivityRun.summaryText.textContent = activitySummary(
                    liveActivityRun.reasoningCount,
                    liveActivityRun.commandCount,
                    liveActivityRun.webSearchCount

            function renderUserItem(item, timestampSeconds) {
                if (pendingUser && pendingUser.parentNode) pendingUser.remove();

                wrap.className = "entry";
                wrap.dataset.itemId = item.id;
                const header = document.createElement("div");
                header.className = "entry-header";
                const role = document.createElement("span");
                role.className = "role";
                role.textContent = liveRoot && liveRoot.dataset.activeAuthor
                    ? liveRoot.dataset.activeAuthor
                    : "User";
                header.appendChild(role);
                header.appendChild(timestampElement(timestampSeconds, ""));
                const msg = document.createElement("div");

                body.className = "body";
                body.textContent = userMessageText(item);

            function userMessageText(item) {
                const parts = [];
                for (const wrapped of item.content || []) {
                    const inner = wrapped || {};
                    switch (inner.type) {
                        case "text":
                            if (inner.text) parts.push(inner.text);
                            break;
                        case "mention": parts.push("@" + (inner.name || "")); break;
                        case "skill": parts.push("/" + (inner.name || "")); break;
                        case "image": parts.push("[image]"); break;
                        case "localImage": parts.push("[image]"); break;
                    }
                }
                return parts.join("\n");

            function memoryEntries(citation) {
                return Array.isArray(citation && citation.entries) ? citation.entries : [];

            function memoryThreadIds(citation) {
                if (Array.isArray(citation && citation.threadIds)) return citation.threadIds;
                if (Array.isArray(citation && citation.thread_ids)) return citation.thread_ids;
                return [];

            function memoryCitationCount(citation) {
                const entries = memoryEntries(citation);
                const threadIds = memoryThreadIds(citation);
                return entries.length + threadIds.length;
            }

            function memoryLine(entry) {
                const start = entry.lineStart ?? entry.line_start;
                const end = entry.lineEnd ?? entry.line_end;

            function appendMemoryRows(popover, rows) {

            function renderMemoryCitation(citation) {

                    popover.appendChild(label);
                    appendMemoryRows(
                        popover,
                        threadIds.map((threadId) => ({ path: threadId, note: "" }))

                details.appendChild(popover);
                return details;
            }

            function setMemoryCitation(message, citation) {

            function renderAgentItem(item, timestampSeconds) {

            function renderToolCallItem(item, timestampSeconds) {

                wrap.className = "entry";

                const header = document.createElement("div");
                header.className = "entry-header";
                const role = document.createElement("span");
                role.className = "role";
                role.textContent = TOOL_LABELS[item.type] || item.type;
                header.appendChild(role);
                header.appendChild(timestampElement(timestampSeconds, ""));
                const row = document.createElement("div");
                row.className = "tool-call";
                const detail = document.createElement(

                row.appendChild(status);

                if (

                if (item.type === "reasoning") {
