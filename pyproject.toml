[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hitch"
version = "0.1.0"
description = "Human Interface for Taming Coding Helpers"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "Django>=6.0,<7.0",
    "openai-codex",
]

[tool.uv.sources]
openai-codex = { git = "https://github.com/openai/codex.git", subdirectory = "sdk/python", tag = "rust-v0.131.0-alpha.18" }

# The Codex SDK pins `openai-codex-cli-bin`, which only ships musllinux/macos/win
# wheels and cannot install on manylinux (e.g. our Ubuntu CI). The runtime
# binary is only loaded when launching the app-server subprocess, so override
# the transitive dep to drop it; callers must point AppServerConfig.codex_bin
# at a local `codex` binary to actually start a session.
[[tool.uv.dependency-metadata]]
name = "openai-codex"
version = "0.131.0a4"
requires-dist = ["pydantic>=2.12"]

[dependency-groups]
dev = [
    "coverage>=7.8.0,<8.0",
    "django-stubs>=6.0,<7.0",
    "django-stubs-ext>=6.0,<7.0",
    "mypy==1.15.0",
    "ruff>=0.11.4,<0.12",
    "setuptools==70.0.0",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true
enable_error_code = ["explicit-override", "ignore-without-code"]
strict = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "hitch.settings.dev"

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[tool.ruff]
line-length = 120
target-version = "py313"
lint.select = [
    "A",
    "B",
    "DJ",
    "E",
    "F",
    "I",
    "N",
    "SIM",
    "UP",
    "W",
]
lint.ignore = ["SIM108"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "migrations",
]
